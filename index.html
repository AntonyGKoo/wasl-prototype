<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wasl Clickable Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@600;700;800&display=swap">
<style>
/* Layout: a guide column beside a single phone; on phones the phone fills the screen and the guide becomes a sheet. */
:root {
  color-scheme: dark;
  /* Wasl Night, from the team's Design folder (Palette@2x) */
  --page: #111418;
  --base: #16191e;
  --surface: #1f242b;
  --raised: #282e36;
  --line: #343b45;
  --text: #f1f3f5;
  --text-2: #a7b0ba;
  --muted: #8a949f;
  --teal: #5cc4b8;
  --violet: #a08ee6;
  --orange: #efa066;
  --blue: #6a93ec;
  --on-accent: #0f1a1c;
  --danger: #f08a8a;
  --card-pro: #2b6f73;
  --card-event: #5e4fae;
  --card-social: #9c5733;
  --card-team: #3f64c0;
  --card-text: #ffffff;
  --scrim: rgba(8, 10, 13, 0.72);
  --display: "Manrope", "Avenir Next", system-ui, sans-serif;
  --body: "DM Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--text);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; }

/* ---------- stage ---------- */
/* desktop: guide and phone both fit the window height; the guide scrolls on its own if it is taller */
.stage {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 56px;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.guide {
  width: 340px;
  flex: none;
  display: flex;
  flex-direction: column;
  gap: 20px;
  max-height: 100%;
  overflow-y: auto;
  scrollbar-width: thin;
  padding-right: 4px;
}
.guide-head { display: flex; align-items: center; gap: 12px; }
.guide-head .mark { width: 44px; height: 28px; }
.guide-head h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
.guide-head p { color: var(--muted); font-size: 12.5px; }
.seg {
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 4px;
  gap: 4px;
}
.seg button {
  border: 0;
  background: transparent;
  border-radius: 9px;
  padding: 8px 10px;
  font-weight: 600;
  color: var(--text-2);
}
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--text); }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.steps button {
  width: 100%;
  display: grid;
  grid-template-columns: 28px 1fr auto;
  align-items: center;
  gap: 10px;
  text-align: left;
  padding: 9px 10px;
  border: 1px solid transparent;
  border-radius: 12px;
  background: transparent;
}
.steps button:hover { background: var(--surface); }
.steps button[aria-current="step"] { background: var(--surface); border-color: var(--line); }
.steps .num {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: var(--raised);
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-2);
}
.steps [aria-current="step"] .num { background: var(--teal); color: var(--on-accent); font-weight: 600; }
.steps .done .num { color: var(--teal); }
.steps .t { font-weight: 600; }
.steps .h { display: block; font-size: 12.5px; color: var(--muted); font-weight: 400; }
.wow {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  padding: 3px 7px;
  border-radius: 6px;
  white-space: nowrap;
}
.wow.w1 { background: rgba(92, 196, 184, 0.14); color: var(--teal); }
.wow.w2 { background: rgba(239, 160, 102, 0.14); color: var(--orange); }
.wow.w3 { background: rgba(160, 142, 230, 0.16); color: var(--violet); }
.guide-note { color: var(--muted); font-size: 12.5px; }
.guide-note b { color: var(--text-2); font-weight: 600; }
.guide-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.ghost {
  border: 1px solid var(--line);
  background: transparent;
  border-radius: 10px;
  padding: 7px 12px;
  font-weight: 600;
  font-size: 14px;
  color: var(--text-2);
}
.ghost:hover { color: var(--text); border-color: var(--muted); }

/* user test panel */
.task-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.task-card .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
.task-card .task { font-family: var(--display); font-size: 17px; font-weight: 700; line-height: 1.35; }
.meter { display: flex; gap: 16px; font-family: var(--mono); font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.results { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.results th, .results td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.results th { color: var(--muted); font-weight: 500; }
.results td.ok { color: var(--teal); }
.results td.no { color: var(--danger); }

/* ---------- device ---------- */
.device {
  position: relative;
  flex: none;
  width: 390px;
  height: 844px;
  max-height: 100%;
  border-radius: 54px;
  background: var(--base);
  border: 10px solid #07090b;
  box-shadow: 0 0 0 1px #2a3038, 0 40px 80px rgba(0, 0, 0, 0.55);
  overflow: hidden;
  isolation: isolate;
}
.statusbar {
  position: absolute; inset: 0 0 auto;
  height: 46px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 30px 0;
  font-family: var(--display);
  font-weight: 700;
  font-size: 15px;
  z-index: 30;
  pointer-events: none;
}
.statusbar .island { position: absolute; left: 50%; top: 9px; width: 112px; height: 32px; border-radius: 20px; background: #000; transform: translateX(-50%); }
.statusbar .icons { display: flex; gap: 5px; align-items: center; }
.statusbar .icons i { display: block; background: var(--text); border-radius: 2px; }
.screen {
  --gutter: 20px;
  /* starts below the status bar, so scrolled content never slides under the clock and notch */
  position: absolute; inset: 46px 0 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 8px var(--gutter) 104px;
  scrollbar-width: none;
}
.screen::-webkit-scrollbar { display: none; }
.screen.no-nav { padding-bottom: 32px; }
.screen.enter { animation: enter 260ms ease-out; }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.tabbar {
  position: absolute; inset: auto 0 0;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  padding: 8px 6px calc(20px + env(safe-area-inset-bottom, 0px));
  background: rgba(22, 25, 30, 0.96);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  z-index: 20;
}
[hidden] { display: none !important; }
.tabbar button {
  border: 0; background: transparent;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: 13px; font-weight: 700;
  color: var(--text-2);
  padding: 4px 0;
}
.tabbar button[aria-current="page"] { color: var(--teal); }
.tabbar svg { width: 25px; height: 25px; }

/* ---------- common app parts ---------- */
.topline { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.wordmark { display: flex; align-items: center; gap: 7px; font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -0.5px; }
.wordmark svg { width: 34px; height: 22px; }
.round {
  width: 42px; height: 42px; border-radius: 50%;
  border: 0;
  display: grid; place-items: center;
  background: var(--teal); color: var(--on-accent);
}
.round.quiet { background: var(--raised); color: var(--text); }
.round svg { width: 20px; height: 20px; }
.back { border: 0; background: transparent; display: flex; align-items: center; gap: 4px; color: var(--text-2); font-weight: 600; padding: 8px 0; }
.back svg { width: 18px; height: 18px; }
.title { font-size: 32px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.15; margin: 6px 0 4px; }
.sub { color: var(--text-2); }
.label { font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; }
.btn {
  border: 0;
  border-radius: 16px;
  padding: 15px 18px;
  font-weight: 700;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  background: var(--teal);
  color: var(--on-accent);
  width: 100%;
  box-shadow: 0 10px 24px rgba(92, 196, 184, 0.18);
}
.btn svg { width: 20px; height: 20px; }
.btn.secondary { background: var(--raised); color: var(--text); box-shadow: none; }
.btn.blue { background: var(--blue); color: #0d1424; box-shadow: none; }
.btn.violet { background: var(--violet); color: #17122b; box-shadow: none; }
.btn.small { width: auto; padding: 10px 14px; font-size: 14px; border-radius: 12px; }
.link { border: 0; background: transparent; color: var(--text-2); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; padding: 6px; }
.hint { text-align: center; color: var(--muted); font-size: 14px; }
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 14px;
}
.chip {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 7px 12px;
  font-weight: 600;
  font-size: 13px;
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--text-2);
}
.chip svg { width: 14px; height: 14px; }
.chip[aria-pressed="true"] { background: rgba(92, 196, 184, 0.16); border-color: var(--teal); color: var(--teal); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.xp {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--teal);
}

/* ---------- business card ---------- */
.card {
  position: relative;
  border-radius: 22px;
  padding: 16px 18px;
  color: var(--card-text);
  overflow: hidden;
  aspect-ratio: 1.6 / 1;
  min-height: 0;
  max-width: 100%;
  display: flex; flex-direction: column;
  box-shadow: 0 18px 34px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.12);
  text-align: left;
  border: 0;
  width: 100%;
}
.card::before, .card::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.14);
  pointer-events: none;
}
.card::before { width: 260px; height: 260px; right: -110px; bottom: -150px; }
.card::after { width: 180px; height: 180px; right: -70px; bottom: -110px; }
.card.pro { background: linear-gradient(150deg, #33797d, var(--card-pro)); }
.card.event { background: linear-gradient(150deg, #6a5bbb, var(--card-event)); }
.card.social { background: linear-gradient(150deg, #a8623c, var(--card-social)); }
.card.team { background: linear-gradient(150deg, #4a70cc, var(--card-team)); }
.card .c-top { display: flex; justify-content: space-between; align-items: center; }
.card .c-word { font-family: var(--display); font-weight: 800; font-size: 21px; letter-spacing: -0.4px; }
.card .c-kind { font-family: var(--display); font-weight: 800; font-size: 11.5px; letter-spacing: 0.22em; }
.card .c-tile { width: 36px; height: 28px; border-radius: 8px; background: rgba(15, 18, 24, 0.28); display: grid; place-items: center; margin-top: 8px; flex: none; }
.card .c-tile svg { width: 26px; height: 16px; }
/* company logo, read from the business card: shown when the card shares a company */
.card .c-tile.logo { align-self: flex-start; background: #f4f2ee; font-family: var(--display); font-weight: 800; font-size: 11px; letter-spacing: -0.2px; width: auto; min-width: 36px; padding: 0 7px; }
.card .c-name { font-family: var(--display); font-weight: 800; font-size: 21px; letter-spacing: -0.4px; margin-top: auto; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .c-line { font-size: 13px; font-weight: 600; opacity: 0.92; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .c-foot { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 6px; gap: 8px; }
.card .c-contacts { display: flex; flex-direction: column; min-width: 0; }
.card .c-mono { font-family: var(--mono); font-size: 11.5px; line-height: 1.4; opacity: 0.9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* small cards fanned out on the welcome screen: fixed size so long text can never stretch them */
.card.mini { width: 196px; height: 122px; aspect-ratio: auto; padding: 12px 14px; border-radius: 16px; }
.card.mini .c-word { font-size: 16px; }
.card.mini .c-kind { font-size: 9px; letter-spacing: 0.18em; }
.card.mini .c-tile { width: 28px; height: 22px; margin-top: 6px; }
.card.mini .c-tile svg { width: 20px; height: 13px; }
.card.mini .c-name { font-size: 16px; }
.card.mini .c-line { font-size: 10.5px; }
.card.mini .c-foot { display: none; }
.card .c-qr { width: 24px; height: 24px; flex: none; opacity: 0.9; }
.card .f { border-radius: 6px; transition: background 120ms; }
.card.editing .f { cursor: pointer; outline: 1px dashed rgba(255, 255, 255, 0.35); outline-offset: 2px; padding: 0 3px; margin-left: -3px; }
.card.editing .f:hover { background: rgba(255, 255, 255, 0.12); }
.card.editing .f.locked { outline: 0; cursor: default; }

/* wallet stack: the cards behind show a strip with what they share; the front card sits in the flow, so the page always makes room for it */
.wallet { --band: 56px; position: relative; margin-top: 12px; }
.wallet .card { position: absolute; left: 0; right: 0; width: 100%; transition: transform 200ms; }
.wallet .card:last-child { position: relative; top: 0 !important; }
.wallet .card.behind .c-tile { visibility: hidden; }
.card .c-peek { font-family: var(--mono); font-size: 12px; font-weight: 500; opacity: 0.92; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-about { display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.card-about b { font-size: 14px; }
.card-about span { color: var(--text-2); font-size: 14px; }
.wallet .card.behind:hover { transform: translateY(-4px); }
.wallet .card.front { animation: lift 320ms ease-out; }
@keyframes lift { from { transform: translateY(-26px); } to { transform: none; } }

/* ---------- screen specifics ---------- */
.join-hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding-top: 16px; }
.join-hero svg.big { width: 96px; height: 62px; }
.join-hero .wm { font-family: var(--display); font-weight: 800; font-size: 40px; letter-spacing: -1.2px; line-height: 1; }
.join-hero p { color: var(--text-2); max-width: 30ch; }
.fan { position: relative; height: 150px; margin: 10px 0 4px; }
.what { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.what li { display: flex; align-items: center; gap: 12px; font-size: 14.5px; color: var(--text-2); }
.what li svg { width: 20px; height: 20px; color: var(--teal); flex: none; }
.what b { color: var(--text); }
.fan .card { position: absolute; left: 50%; top: 14px; }
.viewfinder {
  position: relative;
  border-radius: 24px;
  background: radial-gradient(circle at 50% 40%, #2a3038, #0c0e11);
  height: 330px;
  height: clamp(230px, 40dvh, 330px);
  overflow: hidden;
  display: grid; place-items: center;
}
.paper {
  width: 240px; aspect-ratio: 1.75 / 1;
  background: #f4f2ee;
  color: #1d232b;
  border-radius: 6px;
  padding: 14px 16px;
  transform: rotate(-4deg);
  box-shadow: 0 20px 30px rgba(0, 0, 0, 0.5);
  display: flex; flex-direction: column; gap: 2px;
  font-size: 11px;
}
.paper b { font-family: var(--display); font-size: 15px; }
.paper .m { font-family: var(--mono); font-size: 9.5px; color: #4b5562; margin-top: auto; }
.corners { position: absolute; inset: 40px 30px; border: 2px solid transparent; }
.corners i { position: absolute; width: 26px; height: 26px; border-color: var(--teal); border-style: solid; }
.corners i:nth-child(1) { left: 0; top: 0; border-width: 3px 0 0 3px; border-radius: 10px 0 0 0; }
.corners i:nth-child(2) { right: 0; top: 0; border-width: 3px 3px 0 0; border-radius: 0 10px 0 0; }
.corners i:nth-child(3) { left: 0; bottom: 0; border-width: 0 0 3px 3px; border-radius: 0 0 0 10px; }
.corners i:nth-child(4) { right: 0; bottom: 0; border-width: 0 3px 3px 0; border-radius: 0 0 10px 0; }
.scanline { position: absolute; left: 30px; right: 30px; height: 2px; background: var(--teal); box-shadow: 0 0 18px 4px rgba(92, 196, 184, 0.6); animation: scan 1.4s ease-in-out infinite alternate; }
@keyframes scan { from { top: 50px; } to { top: 270px; } }
.found li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); animation: enter 300ms both; }
.found li:last-child { border-bottom: 0; }

/* real scanner: live camera, capture, OCR, review */
.viewfinder video, .viewfinder img.shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.viewfinder .cam-msg { position: relative; z-index: 1; max-width: 26ch; text-align: center; color: var(--text-2); display: grid; gap: 10px; justify-items: center; padding: 0 16px; }
.viewfinder .cam-msg svg { width: 34px; height: 34px; color: var(--muted); }
.viewfinder .corners, .viewfinder .scanline { z-index: 2; }
.viewfinder.cam::after { content: ""; position: absolute; inset: 40px 30px; border-radius: 12px; box-shadow: 0 0 0 999px rgba(8, 10, 13, 0.45); z-index: 1; pointer-events: none; }
.scan-controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin-top: 16px; }
.scan-controls .file-btn { justify-self: start; }
.shutter { width: 74px; height: 74px; border-radius: 50%; border: 4px solid var(--text); background: var(--teal); box-shadow: inset 0 0 0 4px var(--base); }
.shutter:disabled { opacity: 0.35; cursor: default; }
.progress { height: 8px; border-radius: 6px; background: var(--raised); overflow: hidden; margin-top: 16px; }
.progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--teal), var(--blue)); transition: width 200ms; }
.review { display: grid; gap: 12px; margin: 16px 0; }
.review .thumb { width: 100%; max-height: 150px; object-fit: contain; border-radius: 14px; background: #0c0e11; }
.fields { display: grid; gap: 2px; padding-block: 6px; }
.fld { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.fld:last-child { border-bottom: 0; }
.fld span { color: var(--muted); font-size: 14px; }
.fld input { min-width: 0; background: var(--raised); border: 1px solid transparent; border-radius: 10px; color: var(--text); font: inherit; font-size: 14px; padding: 8px 10px; }
.fld input:focus { outline: none; border-color: var(--teal); }
.fld input::placeholder { color: var(--muted); }
.found { list-style: none; margin: 0; padding: 0; }
.found .k { color: var(--muted); }
.found .v { font-weight: 600; text-align: right; min-width: 0; overflow-wrap: anywhere; }

.level { display: flex; align-items: center; gap: 16px; }
.ring {
  --p: 0.6;
  width: 86px; height: 86px; border-radius: 50%; flex: none;
  background: conic-gradient(var(--teal) calc(var(--p) * 360deg), var(--raised) 0);
  display: grid; place-items: center;
  transition: --p 600ms;
}
.ring .av {
  width: 72px; height: 72px; border-radius: 50%;
  background: linear-gradient(140deg, var(--card-team), var(--card-event));
  display: grid; place-items: center;
  font-family: var(--display); font-weight: 800; font-size: 24px;
}
.ring .av.photo { background: radial-gradient(circle at 50% 38%, #d9a27c 0 15px, transparent 16px), radial-gradient(ellipse at 50% 100%, #3f64c0 0 30px, transparent 31px), linear-gradient(#2b3440, #1d232b); }
.lvl-name { font-family: var(--display); font-weight: 800; font-size: 22px; }
.bar { height: 8px; border-radius: 6px; background: var(--raised); overflow: hidden; margin-top: 8px; }

        starting: [ic("camera"), "Starting the camera…"],
        denied: [ic("camera"), "Camera access is blocked. Allow it in your browser settings, or take a photo instead."],

      }[sc.cam];
      return `${cancel}

          <div class="corners"><i></i><i></i><i></i><i></i></div>
          ${reading ? '<div class="scanline"></div>' : ""}

          ? `<div class="progress"><i id="ocrBar" style="width:${pct}%"></i></div><p class="hint" id="ocrPct" style="margin-top:8px">${sc.status || "Reading the card…"}</p>`

              <button class="shutter" data-act="scan-capture" aria-label="Take the picture" ${sc.cam === "on" ? "" : "disabled"}></button>

            </div>
            <input type="file" id="scanFile" accept="image/*" capture="environment" hidden>

                     : `<b>Tap to record the chat</b><span class="hint">${S.voiceNote ? esc(S.voiceNote) : "Both people agree first. Wasl writes down what's said; no audio is kept."}</span>`}`}

    debrief() {

        return `${back("network", "Network")}

          <p class="sub">Campus networking night · 5 people</p>

    network() {

      let list = "";
      if (!groupKey) list = `<ul class="people">${all.map(personRow).join("")}</ul>`;

    recall() {
      const q = S.query;
      let results = "";
      if (S.recall === "searching") results = `<div class="panel stack" style="margin-top:16px"><span class="label" style="color:var(--violet)">Searching your memories…</span><div class="shimmer"></div><div class="shimmer" style="width:70%"></div></div>`;
      if (S.recall === "done") {
        const r = recallMatch(q);
        results = r.length
          ? r.map((m, i) => `<div style="margin-top:${i ? 18 : 16}px">
              <div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="label">${m.label || (i ? "Also possible" : "Best match")}</span><span class="match">${m.score}% match</span></div>

          : `<div class="panel stack" style="margin-top:16px"><b>No one matched that</b><p class="sub">Try what they did, where you met, or what you talked about.</p></div>`;
      }
      return `<div class="topline"><h2 class="title">Search</h2></div>

          <input id="recallInput" name="q" value="${esc(q)}" placeholder="Describe who you're looking for" aria-label="Describe who you're looking for">
          <button type="button" class="voice" id="voiceBtn" data-act="voice-search" aria-label="Say what you're looking for">${ic("mic")}</button><button type="submit">Ask</button>
        </form>
        ${S.recall === "idle" ? `<div class="stack" style="margin-top:16px"><span class="label">Try</span>${SUGGESTIONS.map((s) => `<button class="suggest" data-act="suggest" data-q="${esc(s)}">${ic("recall")}“${esc(s)}”</button>`).join("")}</div>` : ""}
        ${results}`;
    },

    settings() {
      return `<div class="topline"><h2 class="title">Settings</h2></div>
        <div class="panel" style="margin-top:12px;padding-block:4px">
          <div class="setting"><div><b>Ask both people before recording</b><span>Always on. Wasl never records one-sided.</span></div><button class="switch" role="switch" aria-checked="true" disabled aria-label="Ask both people before recording"></button></div>
          <div class="setting"><div><b>Delete audio after the summary</b><span>Only the text summary is kept.</span></div><button class="switch" role="switch" aria-checked="true" disabled aria-label="Delete audio after the summary"></button></div>
          <div class="setting"><div><b>Use calendar to fill in events</b><span>Reads event titles and times only.</span></div><button class="switch" role="switch" aria-checked="true" data-act="toggle" aria-label="Use calendar to fill in events"></button></div>
          <div class="setting"><div><b>Use location when you swap cards</b><span>Saved to the connection, not shared.</span></div><button class="switch" role="switch" aria-checked="true" data-act="toggle" aria-label="Use location when you swap cards"></button></div>
        </div>
        <button class="btn secondary" style="margin-top:16px" data-act="restart">Restart the mockup</button>
        <p class="hint" style="margin-top:10px">This is a clickable mockup with sample people. Nothing is sent anywhere.</p>`;
    },
  };

  function peopleList() {
    const tonight = TONIGHT.map((p) => ({
      ...p,
      event: "Campus networking night",
      tag: p.id === "mariam" ? (S.tags[0] || "Intro offered") : p.id === "sara" ? "Hiring" : p.id === "yousef" ? "Co-founder" : "Follow up",
      when: "Tonight",
      fav: S.debrief[p.id] === "fav",
    }));
    const met = S.swappedWith ? tonight : tonight.filter((p) => p.id !== "mariam");
    return [...S.scanned, ...met, ...OLDER];
  }
  function albums() {
    const list = [
      { name: "Campus networking night", match: (p) => p.event === "Campus networking night" },
      { name: "Web Summit Qatar", match: (p) => p.event === "Web Summit Qatar" },
      { name: "Pearl Labs", match: (p) => p.org === "Pearl Labs" },
      { name: "CMU-Q alumni mixer", match: (p) => p.event === "CMU-Q alumni mixer" },
    ];
    const all = peopleList();
    return list.map((a) => {
      const ps = all.filter(a.match);
      return { ...a, count: ps.length + (a.name === "Web Summit Qatar" ? 11 : 0), colors: ps.slice(0, 3).map((p) => p.color) };
    }).filter((a) => a.count);
  }
  function personRow(p) {
    const initials = p.name.split(" ").map((w) => w[0]).slice(0, 2).join("");
    const act = p.id === "mariam" ? 'data-go="remember"' : "";
    return `<li><button class="person" ${act}><span class="mini" style="background:var(--card-${p.color})">${initials}</span><span class="pv"><b>${esc(p.name)}</b><span>${esc(p.hideWork ? p.contacts.join(" · ") : `${p.role} · ${p.org}`)}</span></span>${p.fav ? ic("star", 'class="star"') : ""}<span class="label" style="flex:none">${esc(p.when)}</span></button></li>`;
  }
  // words that matter in a question, cut to a short stem so "intro" matches "introduce"
  const STOP = new Set("the a an and or of to in on at for with who whom what which that this my me i you your her his their them she he is was were are be been met meet someone person people from about like can could would".split(" "));
  const stems = (s) => (s.toLowerCase().match(/[a-z0-9]+/g) || []).filter((w) => w.length > 2 && !STOP.has(w)).map((w) => w.slice(0, 5));
  const overlap = (a, b) => { const B = new Set(stems(b)); return stems(a).filter((w) => B.has(w)).length; };
  // the memory point that best answers the question, if any
  function memoryHit(q) {
    if (!S.summary || !S.memory) return null;
    const best = S.memory.points.map((pt) => ({ pt, n: overlap(q, pt) })).sort((a, b) => b.n - a.n)[0];
    return best && best.n > 0 ? best.pt : null;
  }
  function recallMatch(q) {
    const t = q.toLowerCase();
    const has = (...w) => w.some((x) => t.includes(x));
    const m = TONIGHT;
    const out = [];
    const memSrc = () => (S.memory && S.memory.source === "voice" ? "Your recorded chat · Campus networking night, tonight" : S.memory && S.memory.source === "note" ? "Your note · Campus networking night, tonight" : "Your chat summary · Campus networking night, tonight");
    const hit = memoryHit(q);
    const older = (i, contacts, kind) => ({ ...OLDER[i], contacts, kind });
    if (has("going", "attend", "summit")) {
      // network opportunity discovery: people you already met who are going to the same event
      out.push({ p: older(4, ["karim@corniche.example"], "PROFESSIONAL"), label: "Going · worth meeting", score: 92, why: "Investor you met at Web Summit Qatar. You tagged him Investor.", src: "Event guest list · Web Summit Qatar, Nov 4" });
      out.push({ p: older(0, ["linkedin.com/in/hamadalthani"], "PROFESSIONAL"), label: "Also going", score: 80, why: "Mentor at Bayt Ventures. Offered to review your pitch.", src: "Event guest list · Web Summit Qatar, Nov 4" });
    } else if (has("cto", "intro", "engineer", "pearl", "payments")) {
      out.push({ p: m[0], score: 94, why: hit || "Software engineer at Pearl Labs", src: hit ? memSrc() : "Her card · Campus networking night, tonight" });
      if (has("intro")) out.push({ p: { ...OLDER[2], contacts: ["daniel@pearllabs.example"], kind: "PROFESSIONAL" }, score: 61, why: "Tagged Intro offered", src: "Your tag · CMU-Q alumni mixer, Sep 28" });
    } else if (has("design", "portfolio")) {

  // ---------- real card scanning: camera → photo → OCR (Tesseract.js, runs in the browser) → review ----------
  let camStream = null;
  let ocrWorker = null;

  function openScanner(mode) {
    S.sheet = null;

  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { setCam("unavailable"); return; }
    try {
      if (!camStream) {
        camStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false,
        });
      }
      if (S.screen !== "scanner" || !S.scan || S.scan.phase !== "camera") { stopCamera(); return; }
      setCam("on");
    } catch (err) {
      setCam(err && (err.name === "NotAllowedError" || err.name === "SecurityError") ? "denied" : "unavailable");
    }
  }
  function setCam(state) {
    if (!S.scan) return;
    S.scan.cam = state;
    render();
  }
  function attachCamera() {
    const v = document.getElementById("camVideo");
    if (v && camStream && v.srcObject !== camStream) {
      v.srcObject = camStream;
      v.play().catch(() => {});
    }
  }
  function stopCamera() {
    if (camStream) camStream.getTracks().forEach((t) => t.stop());
    camStream = null;
  }

  function loadTesseract() {
    if (window.Tesseract) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
      s.onload = resolve;
      s.onerror = () => reject(new Error("The text reader could not be downloaded."));
      document.head.appendChild(s);
    });
  }
  function getOcrWorker() {
    if (ocrWorker) return Promise.resolve(ocrWorker);
    if (!ocrWorkerPromise) {
      ocrWorkerPromise = loadTesseract()
        .then(() => window.Tesseract.createWorker("eng", 1, {
          logger: (m) => {
            if (!S.scan || S.scan.phase !== "reading") return;
            if (m.status === "recognizing text") { S.scan.progress = 0.15 + m.progress * 0.85; S.scan.status = "Reading the card…"; }
            else if (/loading|initializ/.test(m.status)) { S.scan.progress = Math.min(0.15, (m.progress || 0) * 0.15); S.scan.status = "Getting the text reader ready (first time only)…"; }
            const bar = document.getElementById("ocrBar");
            const label = document.getElementById("ocrPct");
            if (bar) bar.style.width = Math.round(S.scan.progress * 100) + "%";
            if (label) label.textContent = `${S.scan.status} ${Math.round(S.scan.progress * 100)}%`;
          },
        }))
        // "sparse text" finds text scattered around a card; the default single-block mode can skip the big name line
        .then((w) => w.setParameters({ tessedit_pageseg_mode: "11" }).then(() => w))
        .then((w) => (ocrWorker = w))
        .catch((e) => { ocrWorkerPromise = null; throw e; });
    }
    return ocrWorkerPromise;
  }

  function captureFromCamera() {
    const v = document.getElementById("camVideo");
    if (!v || !v.videoWidth) { toast("The camera isn't ready yet"); return; }
    // crop to the frame drawn on screen (the video is shown with object-fit: cover)
    const r = v.getBoundingClientRect();
    const scale = Math.max(r.width / v.videoWidth, r.height / v.videoHeight);
    const offX = (r.width - v.videoWidth * scale) / 2;
    const offY = (r.height - v.videoHeight * scale) / 2;
    const pad = 12;
    const fx = 30 - pad, fy = 40 - pad, fw = r.width - 60 + pad * 2, fh = r.height - 80 + pad * 2;
    const sx = Math.max(0, (fx - offX) / scale), sy = Math.max(0, (fy - offY) / scale);
    const sw = Math.min(v.videoWidth - sx, fw / scale), sh = Math.min(v.videoHeight - sy, fh / scale);
    const canvas = document.createElement("canvas");
    const up = Math.max(1, 1600 / sw);
    canvas.width = Math.round(sw * up);
    canvas.height = Math.round(sh * up);
    canvas.getContext("2d").drawImage(v, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    buzz();
    readCard(canvas);
  }
  function readUploadedPhoto(file) {
    if (!file) return;
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      readCard(canvas);
    };
    img.onerror = () => { URL.revokeObjectURL(url); S.scan.phase = "error"; S.scan.error = "That file isn't a photo Wasl can open. Try a JPG or PNG."; render(); };
    img.src = url;
  }
  async function readCard(canvas) {
    const sc = S.scan;
    stopCamera();
    sc.image = canvas.toDataURL("image/jpeg", 0.85);
    sc.phase = "reading";
    sc.progress = 0.02;
    sc.status = "Getting the text reader ready…";
    render();
    try {
      const worker = await getOcrWorker();
      const { data } = await worker.recognize(grayscale(canvas));
      if (S.scan !== sc) return; // the person left the scanner meanwhile
      sc.raw = data.text;
      sc.fields = parseCard(data.text, data.lines);
      if (!sc.fields.name && !sc.fields.email && !sc.fields.phone) {
        sc.phase = "error";
        sc.error = "Wasl couldn't find a name, email or phone number. Try again with the card flat, in good light, filling the frame.";
      } else sc.phase = "review";
    } catch (e) {
      if (S.scan !== sc) return;
      sc.phase = "error";
      sc.error = "The text reader didn't load. Check the internet connection and try again.";
    }
    render();
  }
  function grayscale(src) {
    const c = document.createElement("canvas");
    c.width = src.width; c.height = src.height;
    const ctx = c.getContext("2d");
    ctx.drawImage(src, 0, 0);
    const img = ctx.getImageData(0, 0, c.width, c.height);
    const d = img.data;
    let lo = 255, hi = 0;
    for (let i = 0; i < d.length; i += 4) { const y = d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114; d[i] = y; if (y < lo) lo = y; if (y > hi) hi = y; }
    const span = Math.max(1, hi - lo);
    for (let i = 0; i < d.length; i += 4) { const y = ((d[i] - lo) / span) * 255; d[i] = d[i + 1] = d[i + 2] = y; }
    ctx.putImageData(img, 0, 0);
    return c;
  }

  // Turn the text of a business card into fields. Cards vary a lot, so this is a best guess
  // that the person reviews before saving.
  function parseCard(text, ocrLines = []) {
    const f = {};
    // how tall each line was printed: the name is usually the biggest text on a card
    const key = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, "");
    const heights = new Map((ocrLines || []).map((l) => [key(l.text || ""), l.bbox ? l.bbox.y1 - l.bbox.y0 : 0]));
    const lines = text.split(/\n+/).map((l) => l.replace(/[|_~`“”‘’«»]+/g, " ").replace(/\s+/g, " ").trim()).filter((l) => l.replace(/[^A-Za-z0-9]/g, "").length >= 2);
    // OCR sometimes breaks a phone number over two lines ("+974 3" / "300 1122"): join them back
    for (let i = 0; i < lines.length - 1; i++) {
      if (/\+?\d[\d\s-]*$/.test(lines[i]) && /^\d[\d\s-]{3,}/.test(lines[i + 1]) && !/@/.test(lines[i + 1])) {
        lines[i] = lines[i] + lines[i + 1].match(/^\d[\d\s-]*/)[0];
        lines[i + 1] = lines[i + 1].replace(/^\d[\d\s-]*/, "").trim();
      }
    }
    const used = new Set();
    const take = (re, key, clean = (x) => x) => {
      for (let i = 0; i < lines.length; i++) {
        // OCR often adds spaces inside emails ("name @ site. com"): close them up before matching
        let line = /@/.test(lines[i]) ? lines[i].replace(/\s*([@.])\s*/g, "$1") : lines[i];
        if (key === "web") line = line.replace(/\S+@\S+/g, " "); // a website is never the part after an email's @
        const m = line.match(re);
        if (m) { f[key] = clean(m[0]); used.add(i); return i; }
      }
      return -1;
    };
    take(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i, "email", (x) => x.toLowerCase());
    take(/(l?inkedin\.com\/in\/[A-Za-z0-9_-]+)/i, "web", (x) => x.toLowerCase().replace(/^inkedin/, "linkedin"));
    take(/(\+?\(?\d[\d\s().-]{6,}\d)/, "phone", (x) => x.replace(/\s+/g, " ").trim());
    if (!f.web) take(/\b((https?:\/\/)?(www\.)?[a-z0-9-]+(\.[a-z0-9-]+)*\.(com|net|org|io|co|qa|edu|ai|app|dev|me|example)(\/\S*)?)\b/i, "web", (x) => x.toLowerCase().replace(/^https?:\/\//, ""));
    // lines that only held contact details or labels are done; the rest are name, role, company
    const placeRe = /^(?:[A-Za-z .'-]+,\s*)?(doha|qatar|dubai|abu dhabi|riyadh|jeddah|kuwait|bahrain|muscat|oman|uae|saudi arabia|lusail|al wakrah|west bay|education city|london|new york|usa|uk)\.?$|\b(street|st\.|road|rd\.|avenue|ave\.|building|bldg|floor|tower|p\.?o\.? ?box|zone)\b/i;
    const rest = lines.map((l, i) => ({ l: l.replace(/^(tel|phone|mobile|mob|email|e-mail|web|www)\s*[:.]?\s*/i, ""), i })).filter(({ l, i }) => !used.has(i) && !/@|\d{4,}|https?:|www\./i.test(l) && !placeRe.test(l));
    const roleRe = /\b(engineer|developer|designer|manager|director|founder|co-founder|ceo|cto|cfo|coo|cmo|chief|officer|student|intern|analyst|consultant|scientist|professor|lecturer|partner|lead|head|president|specialist|coordinator|associate|researcher|architect|marketing|sales|product|recruiter|advisor|owner|freelance|photographer|writer|artist|teacher|doctor|nurse|lawyer|accountant|chef|trainer|coach|editor|producer|journalist|executive|assistant|technician)\b/i;
    const orgRe = /\b(inc|llc|ltd|labs?|university|college|school|group|company|co\.|corp|corporation|studio|capital|ventures|technologies|technology|tech|solutions|systems|bank|foundation|institute|analytics|robotics|consulting|agency|partners|holdings|media|qatar|global|international|hub|fintech|center|centre|association|council|ministry|authority|airways|hospital|clinic|hotel|academy|network)\b/i;
    const isName = (l) => /^[A-Za-z][A-Za-z.'-]+(\s[A-Za-z][A-Za-z.'-]+){1,3}$/.test(l) && !roleRe.test(l) && !orgRe.test(l) && !/\bwasl\b/i.test(l) && !/\b([A-Za-z])\1\b/.test(l);
    // "ghada.alnaimi@…" or "linkedin.com/in/ghadaalnaimi" tells us how the name is spelled
    const handle = ((f.email || "").split("@")[0] + " " + ((f.web || "").match(/\/in\/([a-z0-9-]+)/i) || ["", ""])[1]).toLowerCase();
    const handleLetters = handle.replace(/[^a-z]/g, "");
    const matchesHandle = (l) => {
      const parts = l.toLowerCase().split(/[\s.'-]+/).filter((w) => w.length > 1);
      return parts.length ? parts.filter((w) => handleLetters.includes(w)).length / parts.length : 0;
    };
    const nameFromEmail = () => {
      const local = (f.email || "").split("@")[0];
      const parts = local.split(/[._-]+/).filter((w) => /^[a-z]{2,}$/i.test(w));
      return parts.length >= 2 && parts.length <= 3 ? parts.map((w) => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(" ") : "";
    };
    const pick = (test) => { const x = rest.find((r) => !r.taken && test(r.l)); if (x) x.taken = true; return x ? x.l : ""; };
    for (const r of rest) r.h = heights.get(key(lines[r.i])) || 0;
    const names = rest.filter((r) => isName(r.l)).sort((a, b) => matchesHandle(b.l) - matchesHandle(a.l) || b.h - a.h);
    if (names[0]) { names[0].taken = true; f.name = names[0].l; }
    f.role = pick((l) => roleRe.test(l));
    // a company often appears twice (logo text in capitals, then the full name): prefer the fuller one
    const orgs = rest.filter((r) => !r.taken && orgRe.test(r.l)).sort((a, b) => (a.l === a.l.toUpperCase()) - (b.l === b.l.toUpperCase()) || b.l.length - a.l.length);
    if (orgs[0]) { orgs[0].taken = true; f.org = orgs[0].l; }
    if (!f.org) {
      const domain = (f.email || "").split("@")[1] || (f.web && !/linkedin/.test(f.web) ? f.web.replace(/^www\./, "") : "");
      const base = domain.split(".")[0];
      if (base && !/^(gmail|hotmail|outlook|yahoo|icloud|mail)$/.test(base)) f.org = base.charAt(0).toUpperCase() + base.slice(1);
    }
    // no line looks like a name that fits the email: spell it from the email ("ghada.alnaimi" → "Ghada Alnaimi")
    if (nameFromEmail() && (!f.name || matchesHandle(f.name) === 0)) {
      const kept = rest.find((r) => r.l === f.name);
      if (kept) kept.taken = false;
      f.name = nameFromEmail();
    }
    if (!f.name) f.name = pick(() => true);
    const titleCase = (s) => (s && s === s.toUpperCase() ? s.toLowerCase().replace(/\b[a-z]/g, (c) => c.toUpperCase()) : s);
    f.name = titleCase(f.name);
    return f;
  }

  function typeQuery(text) {
    S.recall = "idle";
    S.query = "";
    render();
    const input = document.getElementById("recallInput");
    let i = 0;
    const step = () => {
      if (S.screen !== "recall") return;
      i += 2;
      input.value = text.slice(0, i);
      if (i < text.length) later(28, step);
      else submitRecall(text);
    };
    step();
  }
  function submitRecall(q) {
    q = q.trim();
    if (!q) return;
    S.query = q;
    S.recall = "searching";
    render();
    later(1100, () => { S.recall = "done"; render(); });
  }

  // ---------- voice: speech-to-text in the browser (Chrome, Edge, Safari) ----------
  const speechRec = () => window.SpeechRecognition || window.webkitSpeechRecognition;
  const SAMPLE_MEMORY = {
    points: ["Software engineer at Pearl Labs, works on their payments app", "Offered an intro to her CTO", "Pearl Labs is hiring interns for summer 2027"],
    transcript: "",
    source: "sample",
  };
  let convo = null; // the recognizer while a conversation is being recorded
  let heard = []; // final phrases heard so far
  let stopping = false;

  function micError(code) {
    if (code === "not-allowed" || code === "service-not-allowed") return "Microphone access is blocked. Allow it in your browser settings, or type a note instead.";
    if (code === "network") return "Speech-to-text needs an internet connection. Type a note instead.";
    if (code === "audio-capture") return "No microphone was found. Type a note instead.";
    return "";
  }

  // Remember: tap to start, tap to stop (holding and releasing also works)
  function startRec() {
    S.rec = "recording";
    S.liveText = "";
    S.voiceNote = speechRec() ? "" : "This browser can't turn speech into text (try Chrome or Safari), so this records a sample.";
    heard = [];
    stopping = false;
    recStart = Date.now();
    render();
    recTimer = setInterval(() => {
      const el = document.getElementById("recTime");
      const s = Math.floor((Date.now() - recStart) / 1000);
      if (el) el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    }, 250);
    if (!speechRec()) { later(3000, stopRec); return; }
    const listen = () => {
      convo = new (speechRec())();
      convo.lang = "en-US";
      convo.continuous = true;
      convo.interimResults = true;
      convo.onresult = (e) => {
        let interim = "";
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const text = e.results[i][0].transcript.trim();
          if (e.results[i].isFinal) { if (text) heard.push(text); } else interim += " " + text;
        }
        S.liveText = (heard.join(" ") + interim).trim();
        const el = document.getElementById("liveText");
        if (el) { el.textContent = S.liveText || "Listening… start talking."; el.scrollTop = el.scrollHeight; }
      };
      convo.onerror = (e) => {
        const msg = micError(e.error);
        if (msg) { S.voiceNote = msg; stopping = true; stopRec(); }
      };
      // phones stop listening after a pause; keep going until the person taps stop
      convo.onend = () => { if (!stopping && S.rec === "recording") { try { listen(); } catch (err) {} } };
      try { convo.start(); } catch (err) { S.voiceNote = "The microphone couldn't start. Type a note instead."; stopping = true; stopRec(); }
    };
    listen();
  }
  function stopRec() {
    if (S.rec !== "recording") return;
    stopping = true;
    clearInterval(recTimer);
    if (convo) { try { convo.stop(); } catch (err) {} convo = null; }
    // give the recognizer a moment to deliver the last phrase
    S.rec = "summarizing";
    render();
    later(speechRec() ? 900 : 1200, () => {
      const phrases = heard.length ? heard : S.liveText ? [S.liveText] : [];
      const transcript = phrases.join(" ").trim();
      S.rec = "idle";
      if (!speechRec()) {
        S.memory = SAMPLE_MEMORY;
      } else if (transcript.split(/\s+/).length < 3) {
        if (!S.voiceNote) S.voiceNote = "Wasl didn't catch anything. Hold the phone closer and try again, or type a note.";
        render();
        return;
      } else {
        S.memory = { points: keyPoints(phrases.flatMap(splitSentences), 3), transcript, source: "voice" };
      }
      S.voiceNote = "";
      S.summary = true;
      render();
      xpToast("Memory saved", 25);
    });
  }

  // Pick the sentences that carry the most useful facts: work, intros, hiring, follow-ups.
  // A real build would use the AI model here; this keeps the mockup free and private.
  function splitSentences(text) {
    return text.split(/(?<=[.!?])\s+|\n+/).map((s) => s.trim()).filter(Boolean);
  }
  function keyPoints(sentences, max) {
    const strong = /\b(work|works|working|engineer|developer|designer|manager|founder|ceo|cto|cfo|intern|interns|internship|hiring|hire|job|jobs|role|team|company|startup|project|building|launch|introduce|intro|introduction|connect|meet|coffee|follow|email|call|next week|tomorrow|looking for|interested|help|offer|offered|recommend|university|study|studying|research|invest|investor|funding|apply|deadline)\b/gi;
    const filler = /\b(um+|uh+|you know|i mean|like,)\s*/gi;
    const scored = sentences.map((s, i) => {
      const clean = s.replace(filler, "").replace(/\s+/g, " ").trim();
      const words = clean.split(" ").length;
      const hits = (clean.match(strong) || []).length;
      const names = (clean.slice(1).match(/\b[A-Z][a-z]+/g) || []).length;
      const numbers = (clean.match(/\d/g) || []).length ? 1 : 0;
      return { i, clean, score: words < 4 ? -1 : hits * 3 + names + numbers };
    }).filter((x) => x.clean);
    let pick = scored.filter((x) => x.score > 0).sort((a, b) => b.score - a.score).slice(0, max);
    if (!pick.length) pick = scored.slice(0, max);
    return pick
      .sort((a, b) => a.i - b.i)
      .map((x) => {
        const s = x.clean.charAt(0).toUpperCase() + x.clean.slice(1);
        return s.length > 120 ? s.slice(0, 117).replace(/\s+\S*$/, "") + "…" : s;
      });
  }

  let holdTimer = null;
  screenEl.addEventListener("pointerdown", (e) => {
    const mic = e.target.closest("#mic");
    if (!mic) return;
    e.preventDefault();
    if (!S.consent) { S.sheet = "consent"; render(); return; }
    if (S.rec === "recording") { stopRec(); return; } // second tap stops
    if (S.rec !== "idle") return;
    startRec();
    const downAt = Date.now();
    const up = () => {
      document.removeEventListener("pointerup", up);
      document.removeEventListener("pointercancel", up);
      if (Date.now() - downAt > 700) stopRec(); // press-and-hold: releasing stops
    };
    document.addEventListener("pointerup", up);
    document.addEventListener("pointercancel", up);
  });
  screenEl.addEventListener("keydown", (e) => {
    if (e.target.id === "mic" && (e.key === "Enter" || e.key === " ")) {
      e.preventDefault();
      if (!S.consent) { S.sheet = "consent"; render(); return; }
      if (S.rec === "idle") startRec();
      else if (S.rec === "recording") stopRec();
    }
    if (e.target.matches('[role="button"][data-act]') && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); e.target.click(); }
  });

  // Recall: say what you're looking for
  let asking = null;
  function voiceSearch() {
    if (asking) { asking.stop(); return; }
    if (!speechRec()) { toast("Voice search needs Chrome or Safari. Type instead."); return; }
    const btn = document.getElementById("voiceBtn");
    const input = document.getElementById("recallInput");
    asking = new (speechRec())();
    asking.lang = "en-US";
    asking.interimResults = true;
    asking.continuous = false;
    let said = "";
    asking.onresult = (e) => {
      said = Array.from(e.results).map((r) => r[0].transcript).join(" ").trim();
      if (input) input.value = said;
    };
    asking.onerror = (e) => { const msg = micError(e.error); if (msg) toast(msg.replace(" Type a note instead.", " Type instead.")); };
    asking.onend = () => {
      asking = null;
      document.getElementById("voiceBtn")?.classList.remove("on");
      if (input) input.placeholder = "Describe who you're looking for";
      if (said) submitRecall(said);
    };
    try {
      asking.start();
      btn?.classList.add("on");
      if (input) { input.value = ""; input.placeholder = "Listening…"; }
    } catch (err) { asking = null; toast("The microphone couldn't start. Type instead."); }
  }

  // debrief deck
  function decide(v) {
    const p = TONIGHT[S.debriefIdx];
    if (!p) return;
    const top = document.querySelector("#deck .card.top");
    S.debrief[p.id] = v;
    const finish = () => { S.debriefIdx++; render(); if (v === "fav") xpToast(`${p.name.split(" ")[0]} favorited`, 5); };
    if (top) {
      top.style.transition = "transform 260ms ease-in, opacity 260ms";
      top.style.transform = `translateX(${v === "fav" ? 420 : -420}px) rotate(${v === "fav" ? 18 : -18}deg)`;
      top.style.opacity = "0";
      later(240, finish);
    } else finish();
  }
  function bindDeck() {
    const top = document.querySelector("#deck .card.top");
    if (!top) return;
    let sx = 0, dx = 0, dragging = false;
    const fav = top.querySelector(".stamp.fav");
    const keep = top.querySelector(".stamp.keep");
    top.addEventListener("pointerdown", (e) => { dragging = true; sx = e.clientX; dx = 0; top.setPointerCapture(e.pointerId); top.style.transition = "none"; });
    top.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      dx = e.clientX - sx;
      top.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
      fav.style.opacity = Math.max(0, Math.min(1, dx / 90));
      keep.style.opacity = Math.max(0, Math.min(1, -dx / 90));
    });
    const end = () => {
      if (!dragging) return;
      dragging = false;
      if (dx > 90) decide("fav");
      else if (dx < -90) decide("keep");
      else { top.style.transition = "transform 200ms"; top.style.transform = ""; fav.style.opacity = 0; keep.style.opacity = 0; }
    };
    top.addEventListener("pointerup", end);
    top.addEventListener("pointercancel", end);
  }

  // clicks
  document.getElementById("device").addEventListener("click", (e) => {
    if (e.target.closest("[data-stop]") && !e.target.closest("[data-act],[data-go]")) return;
    const goEl = e.target.closest("[data-go]");

  });
  screenEl.addEventListener("change", (e) => {
    if (e.target.id === "scanFile" && S.scan) readUploadedPhoto(e.target.files && e.target.files[0]);
    if (e.target.id === "photoFile") readProfilePhoto(e.target.files && e.target.files[0]);
  });
  screenEl.addEventListener("submit", (e) => {

      ME[f] = f === "instagram" && value && !value.startsWith("@") && !/\//.test(value) ? "@" + value : value || ME[f];

  // ---------- walkthrough + user test guide ----------
  const STEPS = [
    { n: "1", t: "Join", wow: 1, h: "Scan your card. Your profile fills itself.", screen: "join" },
    { n: "2", t: "Build", wow: 1, h: "Tap details on the card to hide them. Pick a color.", screen: "build" },
    { n: "3", t: "Share", wow: 1, h: "Share card. Has Wasl? Swap codes. No Wasl? Scan their paper card.", screen: "wallet" },
    { n: "4", t: "Save", wow: 2, h: "Confirm where you met. Add a tag.", screen: "save" },
    { n: "5", t: "Remember", wow: 2, h: "Tap the mic and talk. Wasl keeps only what mattered.", screen: "remember" },
    { n: "+", t: "Debrief", wow: 2, h: "Bonus: swipe through tonight's people.", screen: "debrief" },
    { n: "6", t: "Browse", wow: 3, h: "Albums by event and company build themselves.", screen: "network" },
    { n: "7", t: "Search", wow: 3, h: "Find someone by memory, not by name.", screen: "recall" },
  ];
  const WOW = { 1: "WOW 1", 2: "WOW 2", 3: "WOW 3" };
  const STEP_OF = { join: 0, profile: 0, build: 1, wallet: 2, exchange: 2, save: 3, remember: 4, debrief: 5, network: 6, album: 6, recall: 7, settings: -1 };
  const stepOf = () => (S.screen === "scanner" ? (S.scan.mode === "own" ? 0 : 2) : STEP_OF[S.screen]);

  function setupTo(i) {
    // start clean, then make every earlier step "done" so any step opens the same way each time
    resetAll();
    if (i >= 1) { S.profileFilled = true; S.joinPhase = "choose"; }
    if (i >= 3) { S.swappedWith = S.swappedWith || "pro"; S.exPhase = "done"; }
    if (i >= 4) { S.ctxConfirmed = true; S.mariamSaved = true; if (!S.tags.length) S.tags = ["Intro offered"]; }
    if (i >= 6) { S.summary = true; S.memory = SAMPLE_MEMORY; S.consent = true; }
    const st = STEPS[i];
    if (st.screen === "build") { S.editId = S.front; S.draft = JSON.parse(JSON.stringify(S.cards[S.front])); }
    if (st.screen === "debrief") { S.debriefIdx = 0; S.debrief = {}; }
    if (st.screen === "recall") { S.recall = "idle"; S.query = ""; }
    if (st.screen === "network") { S.sort = "recent"; }
    S.screen = st.screen;
  }

  const TASKS = [
    { text: "Set up your profile using your business card.", done: () => S.profileFilled },
    { text: "Change one of your cards so it does not show your email.", done: () => S.flags.hidEmail },
    { text: "Share a card with Mariam.", done: () => !!S.swappedWith },
    { text: "Save where you met Mariam and tag her as Hiring.", done: () => S.ctxConfirmed && S.tags.includes("Hiring") },
    { text: "Save a memory of your conversation with Mariam.", done: () => S.summary },
    { text: "Find the person who offered you an intro to a CTO, without typing their name.", done: () => S.recall === "done" && !/mariam/i.test(S.query) && recallMatch(S.query).some((m) => m.p.id === "mariam") },
  ];
  const T = { mode: "walk", idx: 0, running: false, start: 0, taps: 0, results: [], tick: null };
  const guide = document.getElementById("guide");
  const mobileBar = document.getElementById("mobileBar");

  function renderGuide() {
    const head = `<div class="guide-head">${symbol("mark")}<div style="flex:1"><h1>Wasl mockup</h1><p>Clickable prototype · Nov 2 check-in</p></div><button class="ghost guide-close" data-g="close">Close</button></div>
      <div class="seg" role="group" aria-label="Mode"><button data-g="walk" aria-pressed="${T.mode === "walk"}">Walkthrough</button><button data-g="test" aria-pressed="${T.mode === "test"}">User test</button></div>`;
    let body = "";
    if (T.mode === "walk") {
      const cur = stepOf();
      body = `<ol class="steps">${STEPS.map((s, i) => `<li><button data-g="step" data-i="${i}" ${cur === i ? 'aria-current="step"' : ""} class="${cur > i ? "done" : ""}"><span class="num">${s.n}</span><span><span class="t">${s.t}</span><span class="h">${s.h}</span></span><span class="wow w${s.wow}">${WOW[s.wow]}</span></button></li>`).join("")}</ol>
        <p class="guide-note"><b>WOW 1</b> Share the right you · <b>WOW 2</b> Every connection keeps its story · <b>WOW 3</b> Find people by memory</p>
        <div class="guide-actions"><button class="ghost" data-g="restart">Restart</button></div>`;
    } else {
      const done = T.results.length >= TASKS.length;
      const t = TASKS[T.idx];
      const secs = T.running ? Math.floor((Date.now() - T.start) / 1000) : 0;
      body = done ? "" : `<div class="task-card">
          <span class="eyebrow">Task ${T.idx + 1} of ${TASKS.length}</span>
          <span class="task">${esc(t.text)}</span>
          ${T.running ? `<div class="meter"><span id="tSecs">${secs}s</span><span id="tTaps">${T.taps} taps</span></div><div class="guide-actions"><button class="ghost" data-g="giveup">They're stuck, skip</button></div>`
            : `<p class="guide-note">Read the task out loud, then press Start. Don't help unless they're stuck.</p><div class="guide-actions"><button class="btn small" data-g="start">Start task</button></div>`}
        </div>`;
      body += T.results.length ? `<div><table class="results"><thead><tr><th>#</th><th>Result</th><th>Time</th><th>Taps</th></tr></thead><tbody>${T.results.map((r, i) => `<tr><td>${i + 1}</td><td class="${r.ok ? "ok" : "no"}">${r.ok ? "Done" : "Skipped"}</td><td>${r.secs}s</td><td>${r.taps}</td></tr>`).join("")}</tbody></table></div>
        <div class="guide-actions"><button class="ghost" data-g="copy">${ic("copy", 'style="width:14px;height:14px;vertical-align:-2px"')} Copy results</button><button class="ghost" data-g="newtest">New tester</button></div>` : "";
      if (done) body = `<div class="task-card"><span class="eyebrow">All tasks done</span><span class="task">Copy the results into your testing notes, then start the next tester.</span></div>` + body;
    }
    guide.innerHTML = head + body;
    // mobile bar
    if (T.mode === "test" && T.running) mobileBar.innerHTML = `<b>Task ${T.idx + 1}</b> ${esc(TASKS[T.idx].text)}`;
    else if (T.mode === "test") mobileBar.innerHTML = `<b>User test</b> Open the guide to start`;
    else { const cur = stepOf(); mobileBar.innerHTML = cur >= 0 ? `<b>Step ${STEPS[cur].n}</b> ${STEPS[cur].t} · ${WOW[STEPS[cur].wow]}` : "<b>Guide</b>"; }
  }
  function checkTask() {
    if (T.mode !== "test" || !T.running) return;
    if (TASKS[T.idx].done()) finishTask(true);
  }
  function finishTask(ok) {
    T.results.push({ ok, secs: Math.round((Date.now() - T.start) / 1000), taps: T.taps });
    T.running = false;
    clearInterval(T.tick);
    T.idx = Math.min(T.idx + 1, TASKS.length - 1);
    if (ok) toast(`Task complete <span class="xp">${T.results[T.results.length - 1].secs}s</span>`);
    renderGuide();
  }
  function prepTask(i) {
    // each task starts from a state where the earlier tasks are done
    if (i === 0) { resetAll(); return; }
    if (i >= 1) { S.profileFilled = true; S.joinPhase = "choose"; S.screen = "profile"; }
    if (i >= 3) { S.swappedWith = S.swappedWith || S.front; S.exPhase = "done"; S.screen = "exchange"; }
    if (i >= 4) { S.ctxConfirmed = true; S.mariamSaved = true; if (!S.tags.includes("Hiring")) S.tags.push("Hiring"); S.screen = "network"; }
    if (i >= 5) { S.summary = true; S.memory = SAMPLE_MEMORY; S.consent = true; S.recall = "idle"; S.query = ""; S.screen = "network"; }
  }
  document.getElementById("device").addEventListener("pointerdown", () => {
    if (T.mode === "test" && T.running) { T.taps++; const el = document.getElementById("tTaps"); if (el) el.textContent = `${T.taps} taps`; }
  }, true);
  mobileBar.addEventListener("click", () => { guide.classList.add("open"); });
  guide.addEventListener("click", (e) => {
    const b = e.target.closest("[data-g]");
    if (!b) return;
    const g = b.dataset.g;
    if (g === "close") { guide.classList.remove("open"); return; }
    if (g === "walk" || g === "test") { T.mode = g; if (g === "test" && !T.results.length && !T.running) { resetAll(); T.idx = 0; } render(); return; }
    if (g === "step") { setupTo(+b.dataset.i); S.sheet = null; guide.classList.remove("open"); render(); return; }
    if (g === "restart") { resetAll(); render(); return; }
    if (g === "start") {
      prepTask(T.idx);
      T.running = true; T.start = Date.now(); T.taps = 0;
      T.tick = setInterval(() => { const el = document.getElementById("tSecs"); if (el) el.textContent = Math.floor((Date.now() - T.start) / 1000) + "s"; }, 500);
      guide.classList.remove("open");
      render();
      return;
    }
    if (g === "giveup") { finishTask(false); return; }
    if (g === "newtest") { T.results = []; T.idx = 0; T.running = false; resetAll(); render(); return; }
    if (g === "copy") {
      const txt = ["Task\tResult\tSeconds\tTaps", ...T.results.map((r, i) => `${i + 1}. ${TASKS[i].text}\t${r.ok ? "Done" : "Skipped"}\t${r.secs}\t${r.taps}`)].join("\n");
      const ok = () => toast("Results copied");
      try { navigator.clipboard.writeText(txt).then(ok, () => fallbackCopy(txt)); } catch (err) { fallbackCopy(txt); }
    }
  });
  function fallbackCopy(txt) {
    const ta = document.createElement("textarea");
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("Results copied"); } catch (e) { toast("Select the table and copy it"); }
    ta.remove();
  }

  // open a step directly with #step-1 … #step-7 (handy for slides and screenshots)
  function openHash() {
    const m = /^#step-(\d|bonus)$/.exec(location.hash || "");
    if (!m) return false;
    const i = m[1] === "bonus" ? 5 : +m[1] >= 6 ? +m[1] : +m[1] - 1;
    setupTo(Math.min(Math.max(i, 0), STEPS.length - 1));
    return true;
  }
  window.addEventListener("hashchange", () => { if (openHash()) render(); });
  openHash();
  render();
})();
</script>
</body>
