<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wasl Clickable Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@600;700;800&display=swap">
<style>
/* Layout: a guide column beside a single phone; on phones the phone fills the screen and the guide becomes a sheet. */
:root {
  color-scheme: dark;
  /* Wasl Night, from the team's Design folder (Palette@2x) */
  --page: #111418;
  --base: #16191e;
  --surface: #1f242b;
  --raised: #282e36;
  --line: #343b45;
  --text: #f1f3f5;
  --text-2: #a7b0ba;
  --muted: #8a949f;
  --teal: #5cc4b8;
  --violet: #a08ee6;
  --orange: #efa066;
  --blue: #6a93ec;
  --on-accent: #0f1a1c;
  --danger: #f08a8a;
  --card-pro: #2b6f73;
  --card-event: #5e4fae;
  --card-social: #9c5733;
  --card-team: #3f64c0;
  --card-text: #ffffff;
  --scrim: rgba(8, 10, 13, 0.72);
  --display: "Manrope", "Avenir Next", system-ui, sans-serif;
  --body: "DM Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--text);
  font-family: var(--body);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; }

/* ---------- stage ---------- */
.stage {
  min-height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 56px;
  padding-block: 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.guide {
  width: 340px;
  flex: none;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.guide-head { display: flex; align-items: center; gap: 12px; }
.guide-head .mark { width: 44px; height: 28px; }
.guide-head h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
.guide-head p { color: var(--muted); font-size: 12.5px; }
.seg {
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 4px;
  gap: 4px;
}
.seg button {
  border: 0;
  background: transparent;
  border-radius: 9px;
  padding: 8px 10px;
  font-weight: 600;
  color: var(--text-2);
}
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--text); }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.steps button {
  width: 100%;
  display: grid;
  grid-template-columns: 28px 1fr auto;
  align-items: center;
  gap: 10px;
  text-align: left;
  padding: 9px 10px;
  border: 1px solid transparent;
  border-radius: 12px;
  background: transparent;
}
.steps button:hover { background: var(--surface); }
.steps button[aria-current="step"] { background: var(--surface); border-color: var(--line); }
.steps .num {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: var(--raised);
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-2);
}
.steps [aria-current="step"] .num { background: var(--teal); color: var(--on-accent); font-weight: 600; }
.steps .done .num { color: var(--teal); }
.steps .t { font-weight: 600; }
.steps .h { display: block; font-size: 12.5px; color: var(--muted); font-weight: 400; }
.wow {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  padding: 3px 7px;
  border-radius: 6px;
  white-space: nowrap;
}
.wow.w1 { background: rgba(92, 196, 184, 0.14); color: var(--teal); }
.wow.w2 { background: rgba(239, 160, 102, 0.14); color: var(--orange); }
.wow.w3 { background: rgba(160, 142, 230, 0.16); color: var(--violet); }
.guide-note { color: var(--muted); font-size: 12.5px; }
.guide-note b { color: var(--text-2); font-weight: 600; }
.guide-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.ghost {
  border: 1px solid var(--line);
  background: transparent;
  border-radius: 10px;
  padding: 7px 12px;
  font-weight: 600;
  font-size: 13px;
  color: var(--text-2);
}
.ghost:hover { color: var(--text); border-color: var(--muted); }

/* user test panel */
.task-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.task-card .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
.task-card .task { font-family: var(--display); font-size: 17px; font-weight: 700; line-height: 1.35; }
.meter { display: flex; gap: 16px; font-family: var(--mono); font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.results { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.results th, .results td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.results th { color: var(--muted); font-weight: 500; }
.results td.ok { color: var(--teal); }
.results td.no { color: var(--danger); }

/* ---------- device ---------- */
.device {
  position: relative;
  flex: none;
  width: 390px;
  height: 844px;
  max-height: calc(100vh - 64px);
  min-height: 640px;
  border-radius: 54px;
  background: var(--base);
  border: 10px solid #07090b;
  box-shadow: 0 0 0 1px #2a3038, 0 40px 80px rgba(0, 0, 0, 0.55);
  overflow: hidden;
  isolation: isolate;
}
.statusbar {
  position: absolute; inset: 0 0 auto;
  height: 46px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 30px 0;
  font-family: var(--display);
  font-weight: 700;
  font-size: 15px;
  z-index: 30;
  pointer-events: none;
}
.statusbar .island { position: absolute; left: 50%; top: 9px; width: 112px; height: 32px; border-radius: 20px; background: #000; transform: translateX(-50%); }
.statusbar .icons { display: flex; gap: 5px; align-items: center; }
.statusbar .icons i { display: block; background: var(--text); border-radius: 2px; }
.screen {
  position: absolute; inset: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 54px 20px 104px;
  scrollbar-width: none;
}
.screen::-webkit-scrollbar { display: none; }
.screen.no-nav { padding-bottom: 32px; }
.screen.enter { animation: enter 260ms ease-out; }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.tabbar {
  position: absolute; inset: auto 0 0;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  padding: 10px 6px calc(22px + env(safe-area-inset-bottom, 0px));
  background: rgba(22, 25, 30, 0.94);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  z-index: 20;
}
[hidden] { display: none !important; }
.tabbar button {
  border: 0; background: transparent;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: 11.5px; font-weight: 600;
  color: var(--muted);
  padding: 4px 0;
}
.tabbar button[aria-current="page"] { color: var(--teal); }
.tabbar svg { width: 22px; height: 22px; }

/* ---------- common app parts ---------- */
.topline { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.wordmark { display: flex; align-items: center; gap: 7px; font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -0.5px; }
.wordmark svg { width: 34px; height: 22px; }
.round {
  width: 42px; height: 42px; border-radius: 50%;
  border: 0;
  display: grid; place-items: center;
  background: var(--teal); color: var(--on-accent);
}
.round.quiet { background: var(--raised); color: var(--text); }
.round svg { width: 20px; height: 20px; }
.back { border: 0; background: transparent; display: flex; align-items: center; gap: 4px; color: var(--text-2); font-weight: 600; padding: 8px 0; }
.back svg { width: 18px; height: 18px; }
.title { font-size: 32px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.15; margin: 6px 0 4px; }
.sub { color: var(--text-2); }
.label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; }
.btn {
  border: 0;
  border-radius: 16px;
  padding: 15px 18px;
  font-weight: 700;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  background: var(--teal);
  color: var(--on-accent);
  width: 100%;
  box-shadow: 0 10px 24px rgba(92, 196, 184, 0.18);
}
.btn svg { width: 20px; height: 20px; }
.btn.secondary { background: var(--raised); color: var(--text); box-shadow: none; }
.btn.blue { background: var(--blue); color: #0d1424; box-shadow: none; }
.btn.violet { background: var(--violet); color: #17122b; box-shadow: none; }
.btn.small { width: auto; padding: 10px 14px; font-size: 14px; border-radius: 12px; }
.link { border: 0; background: transparent; color: var(--text-2); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; padding: 6px; }
.hint { text-align: center; color: var(--muted); font-size: 13px; }
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 14px;
}
.chip {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 7px 12px;
  font-weight: 600;
  font-size: 13px;
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--text-2);
}
.chip svg { width: 14px; height: 14px; }
.chip[aria-pressed="true"] { background: rgba(92, 196, 184, 0.16); border-color: var(--teal); color: var(--teal); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.xp {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--teal);
}

/* ---------- business card ---------- */
.card {
  position: relative;
  border-radius: 22px;
  padding: 16px 18px;
  color: var(--card-text);
  overflow: hidden;
  aspect-ratio: 1.6 / 1;
  min-height: 0;
  max-width: 100%;
  display: flex; flex-direction: column;
  box-shadow: 0 18px 34px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.12);
  text-align: left;
  border: 0;
  width: 100%;
}
.card::before, .card::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.14);
  pointer-events: none;
}
.card::before { width: 260px; height: 260px; right: -110px; bottom: -150px; }
.card::after { width: 180px; height: 180px; right: -70px; bottom: -110px; }
.card.pro { background: linear-gradient(150deg, #33797d, var(--card-pro)); }
.card.event { background: linear-gradient(150deg, #6a5bbb, var(--card-event)); }
.card.social { background: linear-gradient(150deg, #a8623c, var(--card-social)); }
.card.team { background: linear-gradient(150deg, #4a70cc, var(--card-team)); }
.card .c-top { display: flex; justify-content: space-between; align-items: center; }
.card .c-word { font-family: var(--display); font-weight: 800; font-size: 21px; letter-spacing: -0.4px; }
.card .c-kind { font-family: var(--display); font-weight: 800; font-size: 11.5px; letter-spacing: 0.22em; }
.card .c-tile { width: 36px; height: 28px; border-radius: 8px; background: rgba(15, 18, 24, 0.28); display: grid; place-items: center; margin-top: 8px; flex: none; }
.card .c-tile svg { width: 26px; height: 16px; }
.card .c-name { font-family: var(--display); font-weight: 800; font-size: 21px; letter-spacing: -0.4px; margin-top: auto; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .c-line { font-size: 12.5px; font-weight: 600; opacity: 0.92; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .c-foot { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 6px; gap: 8px; }
.card .c-contacts { display: flex; flex-direction: column; min-width: 0; }
.card .c-mono { font-family: var(--mono); font-size: 11px; line-height: 1.4; opacity: 0.9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* small cards fanned out on the welcome screen: fixed size so long text can never stretch them */
.card.mini { width: 196px; height: 122px; aspect-ratio: auto; padding: 12px 14px; border-radius: 16px; }
.card.mini .c-word { font-size: 16px; }
.card.mini .c-kind { font-size: 9px; letter-spacing: 0.18em; }
.card.mini .c-tile { width: 28px; height: 22px; margin-top: 6px; }
.card.mini .c-tile svg { width: 20px; height: 13px; }
.card.mini .c-name { font-size: 16px; }
.card.mini .c-line { font-size: 10.5px; }
.card.mini .c-foot { display: none; }
.card .c-qr { width: 24px; height: 24px; flex: none; opacity: 0.9; }
.card .f { border-radius: 6px; transition: background 120ms; }
.card.editing .f { cursor: pointer; outline: 1px dashed rgba(255, 255, 255, 0.35); outline-offset: 2px; padding: 0 3px; margin-left: -3px; }
.card.editing .f:hover { background: rgba(255, 255, 255, 0.12); }
.card.editing .f.locked { outline: 0; cursor: default; }

/* wallet stack */
.wallet { position: relative; margin-top: 14px; }
.wallet .card { position: absolute; left: 0; right: 0; width: 100%; transition: transform 200ms; }
.wallet .card.behind:hover { transform: translateY(-4px); }
.wallet .card.front { animation: lift 320ms ease-out; }
@keyframes lift { from { transform: translateY(-26px); } to { transform: none; } }

/* ---------- screen specifics ---------- */
.join-hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding-top: 40px; }
.join-hero svg.big { width: 128px; height: 82px; }
.join-hero .wm { font-family: var(--display); font-weight: 800; font-size: 44px; letter-spacing: -1.2px; line-height: 1; }
.join-hero p { color: var(--text-2); max-width: 26ch; }
.fan { position: relative; height: 160px; margin: 18px 0 8px; }
.fan .card { position: absolute; left: 50%; top: 14px; }
.viewfinder {
  position: relative;
  border-radius: 24px;
  background: radial-gradient(circle at 50% 40%, #2a3038, #0c0e11);
  height: 330px;
  overflow: hidden;
  display: grid; place-items: center;
}
.paper {
  width: 240px; aspect-ratio: 1.75 / 1;
  background: #f4f2ee;
  color: #1d232b;
  border-radius: 6px;
  padding: 14px 16px;
  transform: rotate(-4deg);
  box-shadow: 0 20px 30px rgba(0, 0, 0, 0.5);
  display: flex; flex-direction: column; gap: 2px;
  font-size: 11px;
}
.paper b { font-family: var(--display); font-size: 15px; }
.paper .m { font-family: var(--mono); font-size: 9.5px; color: #4b5562; margin-top: auto; }
.corners { position: absolute; inset: 40px 30px; border: 2px solid transparent; }
.corners i { position: absolute; width: 26px; height: 26px; border-color: var(--teal); border-style: solid; }
.corners i:nth-child(1) { left: 0; top: 0; border-width: 3px 0 0 3px; border-radius: 10px 0 0 0; }
.corners i:nth-child(2) { right: 0; top: 0; border-width: 3px 3px 0 0; border-radius: 0 10px 0 0; }
.corners i:nth-child(3) { left: 0; bottom: 0; border-width: 0 0 3px 3px; border-radius: 0 0 0 10px; }
.corners i:nth-child(4) { right: 0; bottom: 0; border-width: 0 3px 3px 0; border-radius: 0 0 10px 0; }
.scanline { position: absolute; left: 30px; right: 30px; height: 2px; background: var(--teal); box-shadow: 0 0 18px 4px rgba(92, 196, 184, 0.6); animation: scan 1.4s ease-in-out infinite alternate; }
@keyframes scan { from { top: 50px; } to { top: 270px; } }
.found li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); animation: enter 300ms both; }
.found li:last-child { border-bottom: 0; }
.found { list-style: none; margin: 0; padding: 0; }
.found .k { color: var(--muted); }
.found .v { font-weight: 600; text-align: right; min-width: 0; overflow-wrap: anywhere; }

.level { display: flex; align-items: center; gap: 16px; }
.ring {
  --p: 0.6;
  width: 86px; height: 86px; border-radius: 50%; flex: none;
  background: conic-gradient(var(--teal) calc(var(--p) * 360deg), var(--raised) 0);
  display: grid; place-items: center;
  transition: --p 600ms;
}
.ring .av {
  width: 72px; height: 72px; border-radius: 50%;
  background: linear-gradient(140deg, var(--card-team), var(--card-event));
  display: grid; place-items: center;
  font-family: var(--display); font-weight: 800; font-size: 24px;
}
.ring .av.photo { background: radial-gradient(circle at 50% 38%, #d9a27c 0 15px, transparent 16px), radial-gradient(ellipse at 50% 100%, #3f64c0 0 30px, transparent 31px), linear-gradient(#2b3440, #1d232b); }
.lvl-name { font-family: var(--display); font-weight: 800; font-size: 22px; }
.bar { height: 8px; border-radius: 6px; background: var(--raised); overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--teal), var(--blue)); border-radius: 6px; transition: width 500ms; }
.detail { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.detail:last-child { border-bottom: 0; }
.detail .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--raised); display: grid; place-items: center; flex: none; color: var(--text-2); }
.detail .ic svg { width: 17px; height: 17px; }
.detail .dv { min-width: 0; flex: 1; }
.detail .dv b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.detail .dv span { color: var(--muted); font-size: 12.5px; }
.detail.missing .dv b { color: var(--muted); }

.swatches { display: flex; gap: 12px; }
.swatch { width: 40px; height: 40px; border-radius: 50%; border: 3px solid transparent; box-shadow: 0 0 0 1px var(--line); }
.swatch[aria-pressed="true"] { border-color: var(--text); }
.swatch.pro { background: var(--card-pro); }
.swatch.event { background: var(--card-event); }
.swatch.social { background: var(--card-social); }
.swatch.team { background: var(--card-team); }

.exchange { position: relative; height: 470px; margin-top: 8px; }
.exchange .slot { position: absolute; left: 0; right: 0; transition: transform 700ms cubic-bezier(.6, -0.2, .3, 1.3), opacity 300ms; }
.exchange .theirs { top: 0; }
.exchange .yours { bottom: 0; }
.exchange .slot .who { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
.exchange.swapping .theirs { transform: translateY(258px) rotate(-3deg); }
.exchange.swapping .yours { transform: translateY(-258px) rotate(3deg); }
.exchange .pulse { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px; border-radius: 50%; display: grid; place-items: center; background: var(--raised); color: var(--teal); z-index: 2; }
.exchange .pulse svg { width: 28px; height: 28px; }
.exchange.swapping .pulse { animation: buzz 120ms linear 6; }
@keyframes buzz { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.qr { width: 100%; height: 100%; }

.ctx .item { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; }
.ctx .item svg { width: 18px; height: 18px; color: var(--teal); flex: none; margin-top: 2px; }
.ctx .src { display: block; color: var(--muted); font-size: 12px; }
.confirmed { display: flex; align-items: center; gap: 8px; color: var(--teal); font-weight: 600; }
.confirmed svg { width: 18px; height: 18px; }

.mic-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px 0 4px; }
.mic {
  width: 84px; height: 84px; border-radius: 50%; border: 0;
  background: var(--orange); color: #2a1606;
  display: grid; place-items: center;
  box-shadow: 0 0 0 10px rgba(239, 160, 102, 0.12);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.mic svg { width: 32px; height: 32px; }
.mic.rec { animation: ring 1s ease-out infinite; background: var(--danger); }
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(240, 138, 138, 0.5); } 100% { box-shadow: 0 0 0 22px rgba(240, 138, 138, 0); } }
.wave { display: flex; align-items: center; gap: 4px; height: 36px; }
.wave i { width: 4px; border-radius: 3px; background: var(--orange); animation: wv 700ms ease-in-out infinite alternate; }
@keyframes wv { from { height: 6px; } to { height: 34px; } }
.summary { border-color: rgba(239, 160, 102, 0.45); }
.summary ul { margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }

.summary .kept svg { width: 14px; height: 14px; }

.deck { position: relative; height: 330px; margin-top: 10px; touch-action: pan-y; }
.deck .card { position: absolute; left: 0; right: 0; top: 0; aspect-ratio: auto; height: 300px; user-select: none; -webkit-user-select: none; }
.deck .card.top { cursor: grab; touch-action: none; }
.deck .card .c-name { font-size: 26px; }
.deck .note { font-size: 13px; opacity: 0.9; margin-top: 4px; }
.stamp { position: absolute; top: 24px; padding: 4px 10px; border: 2px solid; border-radius: 8px; font-family: var(--display); font-weight: 800; letter-spacing: 0.1em; opacity: 0; font-size: 14px; }
.stamp.fav { left: 20px; color: #ffd27a; border-color: #ffd27a; transform: rotate(-12deg); }
.stamp.keep { right: 20px; color: #ffffff; border-color: #ffffff; transform: rotate(12deg); }
.deck-actions { display: flex; justify-content: center; gap: 22px; }
.deck-actions button { width: 60px; height: 60px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.deck-actions button svg { width: 24px; height: 24px; }
.deck-actions .keep { color: var(--text-2); }
.deck-actions .mem { color: var(--orange); }
.deck-actions .fav { color: #ffd27a; }

.albums { display: flex; gap: 12px; overflow-x: auto; padding: 4px 2px 10px; margin: 0 -20px; padding-left: 20px; padding-right: 20px; scroll-padding-inline: 20px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.albums::-webkit-scrollbar { display: none; }
.album { flex: none; width: 140px; border: 0; background: transparent; text-align: left; padding: 0; scroll-snap-align: start; }
.album .cover { position: relative; height: 96px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.album .cover i { position: absolute; width: 86px; height: 54px; border-radius: 9px; left: 26px; top: 22px; box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35); }
.album .cover i:nth-child(1) { transform: rotate(-12deg) translateX(-14px); }
.album .cover i:nth-child(3) { transform: rotate(10deg) translateX(14px) translateY(6px); }
.album b { display: block; margin-top: 8px; font-weight: 600; font-size: 13.5px; line-height: 1.3; }
.album span { color: var(--muted); font-size: 12px; }
.album.new .cover { display: grid; place-items: center; border-style: dashed; color: var(--muted); }
.album.new .cover svg { width: 26px; height: 26px; }
.auto { font-family: var(--mono); font-size: 10px; color: var(--teal); }
.people { list-style: none; margin: 0; padding: 0; }
.person { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); width: 100%; background: transparent; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.person .mini { width: 52px; height: 34px; border-radius: 7px; flex: none; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 13px; color: #fff; }
.person .pv { min-width: 0; flex: 1; }
.person .pv b { display: block; font-weight: 600; }
.person .pv span { color: var(--muted); font-size: 12.5px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person .star { color: #ffd27a; width: 16px; height: 16px; }
.group-h { margin-top: 16px; }
.flip { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -20px; padding: 6px 20px 14px; scrollbar-width: none; }
.flip::-webkit-scrollbar { display: none; }
.flip .card { flex: none; width: 300px; scroll-snap-align: center; }

.search { display: flex; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 6px 6px 6px 14px; }
.search:focus-within { border-color: var(--violet); }
.search svg { width: 18px; height: 18px; color: var(--violet); flex: none; }
.search input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--text); font: inherit; font-size: 15px; padding: 8px 0; outline: none; }
.search input::placeholder { color: var(--muted); }
.search button { border: 0; border-radius: 12px; background: var(--violet); color: #17122b; padding: 9px 12px; font-weight: 700; }
.suggest { border: 1px solid var(--line); background: transparent; border-radius: 14px; padding: 10px 12px; text-align: left; color: var(--text-2); display: flex; gap: 8px; align-items: flex-start; width: 100%; }
.suggest svg { width: 15px; height: 15px; color: var(--violet); flex: none; margin-top: 3px; }
.why { border-color: rgba(160, 142, 230, 0.45); }
.why q { display: block; font-style: italic; color: var(--text); margin-top: 6px; }
.why q::before, .why q::after { content: ""; }
.match { font-family: var(--mono); font-size: 11px; color: var(--violet); }

.setting { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.setting:last-child { border-bottom: 0; }
.setting span { color: var(--muted); font-size: 12.5px; display: block; }
.switch { width: 46px; height: 28px; border-radius: 20px; background: var(--teal); position: relative; flex: none; border: 0; }
.switch::after { content: ""; position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; }
.switch[aria-checked="false"] { background: var(--raised); }
.switch[aria-checked="false"]::after { right: auto; left: 3px; }

/* sheet + toast */
.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 40; display: flex; align-items: flex-end; animation: fade 160ms; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; background: var(--surface); border-radius: 26px 26px 0 0; padding: 22px 20px calc(30px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; animation: up 220ms ease-out; border-top: 1px solid var(--line); }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet h3 { font-size: 20px; }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: -8px auto 2px; }
.toast {
  position: absolute; left: 50%; top: 56px; z-index: 50;
  transform: translateX(-50%);
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 8px 14px;
  font-weight: 600;
  font-size: 13px;
  white-space: nowrap;
  display: flex; gap: 8px; align-items: center;
  animation: toast 2.2s ease forwards;
  pointer-events: none;
}
.toast .xp { font-size: 12px; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -10px); } 10%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -6px); } }
.confetti { position: absolute; inset: 0; pointer-events: none; z-index: 45; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 9px; height: 9px; border-radius: 50%; animation: fall 1.6s ease-in forwards; }
@keyframes fall { to { transform: translateY(880px) rotate(320deg); opacity: 0.2; } }

/* mobile: phone fills the screen, guide becomes a sheet */
.mobile-bar { display: none; }
@media (max-width: 760px) {
  .stage { display: block; padding: 0; min-height: 0; height: 100%; }
  .device { width: 100%; height: 100%; max-height: none; min-height: 0; border: 0; border-radius: 0; box-shadow: none; }
  .statusbar { display: none; }
  .screen {
    padding-top: 52px;
    padding-left: max(18px, env(safe-area-inset-left, 0px));
    padding-right: max(18px, env(safe-area-inset-right, 0px));
  }
  .toast { top: 48px; }
  .guide { display: none; }
  .guide.open {
    display: flex;
    position: fixed; inset: 0; z-index: 80;
    width: auto;
    background: var(--page);
    overflow-y: auto;
    padding: 20px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px));
  }
  .mobile-bar {
    display: flex;
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    z-index: 35;
    max-width: calc(100% - 32px);
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 999px;
    padding: 6px 12px;
    gap: 6px; align-items: center;
    font-size: 12px; font-weight: 600; color: var(--text-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mobile-bar b { color: var(--teal); }
  .guide-close { display: inline-flex !important; }
}
.guide-close { display: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
}
</style>
</head>

<script>
(() => {
  "use strict";

  // ---------- icons (Lucide-style strokes, drawn inline) ----------
  const P = {

  const ic = (name, extra = "") =>
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${P[name]}</svg>`;
  let symId = 0;
  const symbol = (cls = "") => {
    const id = "g" + symId++;
    return `<svg class="${cls}" viewBox="0 0 64 40" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" x2="1"><stop offset="0" stop-color="#efa066"/><stop offset=".45" stop-color="#a08ee6"/><stop offset=".72" stop-color="#6a93ec"/><stop offset="1" stop-color="#5cc4b8"/></linearGradient></defs><path d="M6 24c5 0 7 10 14 10s9-8 12-8 6 8 12 8c8 0 12-8 12-15 0-5-3-8-6-8" fill="none" stroke="url(#${id})" stroke-width="6.5" stroke-linecap="round"/><circle cx="9" cy="13" r="5.5" fill="#efa066"/><circle cx="32" cy="17" r="4.8" fill="#a08ee6"/><circle cx="52" cy="5.5" r="5" fill="#5cc4b8"/></svg>`;

  const MARIAM = {

    { id: "lina", name: "Lina Farouk", role: "Data scientist", org: "Falcon Analytics", contacts: ["lina@falcon.example", "linkedin.com/in/linafarouk"], color: "pro", kind: "PROFESSIONAL", note: "Talked about her NLP research" },

  }
  function personCard(p, opts = {}) {
    const lines = p.hideWork ? [] : [p.role, p.org].filter(Boolean);
    const contacts = opts.foot ? [opts.foot] : p.contacts || [];
    return `<div class="card ${p.color} ${opts.cls || ""}" ${opts.attrs || ""}>
      <div class="c-top"><span class="c-word">wasl</span><span class="c-kind">${p.kind || "PROFESSIONAL"}</span></div>
      <div class="c-tile">${symbol()}</div>
      <div class="c-name">${esc(p.name)}</div>
      ${lines.map((l) => `<div class="c-line">${esc(l)}</div>`).join("")}
      ${opts.note ? `<div class="note">${esc(opts.note)}</div>` : ""}
      <div class="c-foot"><span class="c-contacts">${contacts.map((x) => `<span class="c-mono">${esc(x)}</span>`).join("")}</span><span class="c-qr">${ic("qr")}</span></div>
      ${opts.stamps ? '<span class="stamp fav">FAVORITE</span><span class="stamp keep">CONTACT</span>' : ""}
    </div>`;
  }
  const back = (to, label = "Back") => `<button class="back" data-go="${to}">${ic("left")}${label}</button>`;
  const xpToast = (text, xp) => toast(`${esc(text)}${xp ? ` <span class="xp">+${xp} XP</span>` : ""}`);

  function qrSvg(seed) {
    const n = 21;
    let s = seed;
    const rnd = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
    let rects = "";
    const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#16191e"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="#16191e"/>`;
    for (let y = 0; y < n; y++)
      for (let x = 0; x < n; x++) {
        const inF = (x < 8 && y < 8) || (x > 12 && y < 8) || (x < 8 && y > 12);
        if (!inF && rnd() > 0.52) rects += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
      }
    return `<svg class="qr" viewBox="-2 -2 25 25" shape-rendering="crispEdges" aria-label="QR code"><rect x="-2" y="-2" width="25" height="25" rx="2" fill="#fff"/><g fill="#16191e">${rects}</g>${finder(0, 0)}${finder(14, 0)}${finder(0, 14)}</svg>`;
  }

  // ---------- screens ----------
  const screens = {
    join() {
      if (S.joinPhase === "scanning" || S.joinPhase === "linkedin") {
        const li = S.joinPhase === "linkedin";
        return `${back("join-reset", "Cancel")}
          <h2 class="title" style="font-size:26px">${li ? "Importing from LinkedIn" : "Scan your business card"}</h2>
          <p class="sub">${li ? "Reading your public profile." : "Hold it inside the frame. Wasl reads it for you."}</p>
          <div class="viewfinder" style="margin-top:18px">
            ${li ? `<div style="display:grid;place-items:center;gap:14px;color:var(--blue)">${ic("linkedin", 'style="width:56px;height:56px"')}<div class="shimmer" style="width:180px"></div><div class="shimmer" style="width:120px"></div></div>` : `<div class="paper"><b>Antony Gu</b><span>Computer science student</span><span>Carnegie Mellon University in Qatar</span><span class="m">antony@wasl.example.test<br>+974 5512 0347 · linkedin.com/in/antonygu</span></div><div class="corners"><i></i><i></i><i></i><i></i></div><div class="scanline"></div>`}
          </div>
          <p class="hint" style="margin-top:14px">Reading 6 details…</p>`;
      }
      if (S.joinPhase === "found") {
        const rows = ["name", "role", "org", "email", "phone", "linkedin"];
        return `${back("join-reset", "Start over")}
          <h2 class="title" style="font-size:26px">Found 6 details</h2>
          <p class="sub">Check them, then we build your profile.</p>
          <div class="panel" style="margin:18px 0">
            <ul class="found">${rows.map((f, i) => `<li style="animation-delay:${i * 110}ms"><span class="k">${FIELD_META[f].label}</span><span class="v">${esc(ME[f])}</span></li>`).join("")}</ul>
          </div>
          <button class="btn" data-act="create-profile">${ic("check")}Create my profile</button>`;
      }
      return `<div class="join-hero">
          ${symbol("big")}
          <div class="wm">wasl</div>
          <p>Never forget who you met, or why it mattered.</p>
        </div>
        <div class="fan" aria-hidden="true">
          ${card("social", { mini: true, attrs: 'style="transform:translateX(-88%) rotate(-12deg) scale(.9)"' })}
          ${card("event", { mini: true, attrs: 'style="transform:translateX(-12%) rotate(10deg) scale(.9)"' })}
          ${card("pro", { mini: true, attrs: 'style="transform:translateX(-50%) rotate(-2deg);top:24px"' })}
        </div>
        <div class="stack" style="margin-top:22px">
          <button class="btn" data-act="scan-own">${ic("scan")}Scan my business card</button>
          <button class="btn blue" data-act="import-linkedin">${ic("linkedin")}Import from LinkedIn</button>
          <button class="link" data-act="email-signup">Sign up with email instead</button>
        </div>`;
    },

    profile() {
      if (!S.profileFilled)
        return `<div class="topline"><h2 class="title">Profile</h2></div>
          <div class="panel stack" style="margin-top:16px"><b>Your profile is empty</b><p class="sub">Scan your business card or import LinkedIn to fill it in one step.</p><button class="btn small" data-go="join">Get started</button></div>`;
      const L = level();
      const row = (f, val, missing) => `<div class="detail ${missing ? "missing" : ""}">
          <span class="ic">${ic(FIELD_META[f] ? FIELD_META[f].icon : "camera")}</span>
          <span class="dv"><b>${esc(val)}</b><span>${FIELD_META[f] ? FIELD_META[f].label : "Photo"}</span></span>
          ${missing ? `<button class="chip" data-act="add-detail" data-f="${f}">${ic("plus")}Add <span class="xp">+20 XP</span></button>` : ""}
        </div>`;
      return `<div class="topline"><h2 class="title">Profile</h2><span class="label">From your card</span></div>
        <div class="panel" style="margin-top:10px">
          <div class="level">
            <div class="ring" style="--p:${L.pct}"><div class="av ${S.extra.photo ? "photo" : ""}">${S.extra.photo ? "" : "AG"}</div></div>
            <div style="flex:1;min-width:0">
              <div class="label">Level ${L.n}</div>
              <div class="lvl-name">${L.name}</div>
              <div class="bar"><i style="width:${Math.round(L.pct * 100)}%"></i></div>
              <p class="sub" style="font-size:12.5px;margin-top:6px">${L.need ? `${L.need} more detail${L.need > 1 ? "s" : ""} to reach Level ${L.n + 1}` : "Profile complete. Every card can use any detail."}</p>
            </div>
          </div>
        </div>
        <div class="panel" style="margin-top:14px;padding-block:4px">
          ${["name", "role", "org", "email", "linkedin", "phone"].map((f) => row(f, ME[f])).join("")}
          ${S.extra.instagram ? row("instagram", ME.instagram) : row("instagram", "Add your Instagram", true)}
          ${S.extra.photo ? row("photo", "Profile photo added") : row("photo", "Add a profile photo", true)}
        </div>
        <button class="btn" style="margin-top:16px" data-go="wallet">${ic("cards")}See my cards</button>`;
    },

    build() {
      const d = S.draft;
      const allContact = ["role", "org", "email", "linkedin", "phone", "instagram"];
      const hidden = allContact.filter((f) => !d.fields.includes(f));
      return `${back("wallet", "Cards")}
        <h2 class="title" style="font-size:26px">Edit ${KIND[S.editId].toLowerCase().replace(/^\w/, (c) => c.toUpperCase())} card</h2>
        <p class="sub">Tap a detail on the card to hide it.</p>
        <div style="margin:16px 0 18px">${card(S.editId, { data: d, edit: true })}</div>
        <div class="stack">
          <div class="label">Add from your profile</div>
          <div class="chips">${hidden.length ? hidden.map((f) => `<button class="chip" data-act="add-field" data-f="${f}">${ic(FIELD_META[f].icon)}${FIELD_META[f].label}</button>`).join("") : '<span class="sub" style="font-size:13px">Everything is on this card.</span>'}</div>
          <div class="label" style="margin-top:6px">Color</div>
          <div class="swatches">${["pro", "event", "social", "team"].map((c) => `<button class="swatch ${c}" data-act="color" data-c="${c}" aria-pressed="${d.color === c}" aria-label="${COLOR_NAME[c]}"></button>`).join("")}</div>
          <button class="btn" style="margin-top:12px" data-act="save-card">${ic("check")}Save card</button>
        </div>`;
    },

    wallet() {
      const band = 66;
      const cardH = 216;
      const order = S.order;
      const h = band * (order.length - 1) + cardH;
      return `<div class="topline"><span class="wordmark">${symbol()}wasl</span><button class="round" data-act="edit-front" aria-label="Edit the front card">${ic("plus")}</button></div>
        <h2 class="title">My cards</h2>
        <div class="wallet" style="height:${h}px">
          ${order.map((id, i) => card(id, { cls: id === S.front ? "front" : "behind", attrs: `style="top:${i * band}px;z-index:${i + 1}" data-act="front" data-id="${id}" role="button" tabindex="0" aria-label="${KIND[id]} card"` })).join("")}
        </div>
        <div class="stack" style="margin-top:16px">
          <button class="btn" data-act="share">${ic("qr")}Share ${KIND[S.front].charAt(0) + KIND[S.front].slice(1).toLowerCase()}</button>
          <div class="row" style="justify-content:center;gap:4px"><p class="hint">Tap a card to bring it forward ·</p><button class="link" style="font-size:13px" data-act="edit-front">Edit this card</button></div>
        </div>`;
    },

    exchange() {
      const kind = KIND[S.front].charAt(0) + KIND[S.front].slice(1).toLowerCase();
      if (S.exPhase === "paper")
        return `${back("exchange-reset", "Cancel")}
          <h2 class="title" style="font-size:26px">Scan their paper card</h2>
          <p class="sub">No Wasl? Hold their business card inside the frame.</p>
          <div class="viewfinder" style="margin-top:18px">
            <div class="paper"><b>Mariam Ali</b><span>Software engineer</span><span>Pearl Labs</span><span class="m">mariam@pearllabs.example<br>+974 5571 2290 · pearllabs.example</span></div>
            <div class="corners"><i></i><i></i><i></i><i></i></div><div class="scanline"></div>
          </div>
          <p class="hint" style="margin-top:14px">Reading the card…</p>`;
      if (S.exPhase === "paperfound") {
        const rows = [["Name", "Mariam Ali"], ["Role", "Software engineer"], ["Company", "Pearl Labs"], ["Email", "mariam@pearllabs.example"], ["Phone", "+974 5571 2290"]];
        return `${back("exchange-reset", "Start over")}
          <h2 class="title" style="font-size:26px">Found 5 details</h2>
          <p class="sub">Check them before saving. Wasl sends Mariam an invite to get her own card.</p>
          <div class="panel" style="margin:18px 0">
            <ul class="found">${rows.map(([k, v], i) => `<li style="animation-delay:${i * 110}ms"><span class="k">${k}</span><span class="v">${esc(v)}</span></li>`).join("")}</ul>
          </div>
          <button class="btn" data-act="paper-save">${ic("check")}Save Mariam</button>`;
      }
      if (S.exPhase === "done")
        return `${back("wallet", "Cards")}
          <h2 class="title" style="font-size:26px">${S.swappedWith === "paper" ? "Mariam's paper card is saved" : "You swapped cards with Mariam"}</h2>
          <p class="sub">${S.swappedWith === "paper" ? "Wasl turned it into a card and invited her to join." : `She has your ${kind} card. Hers is now in your wallet.`}</p>
          <div style="margin:18px 0">${personCard(MARIAM)}</div>
          <button class="btn" data-go="save">${ic("check")}Save Mariam</button>`;
      return `${back("wallet", "Cards")}
        <h2 class="title" style="font-size:26px">Share your ${kind} card</h2>
        <p class="sub">Scan Mariam's code, or let her scan yours.</p>
        <div class="exchange ${S.exPhase === "swapping" ? "swapping" : ""}" id="exchange">
          <div class="slot theirs"><div class="who">Mariam's phone</div>${personCard(MARIAM)}</div>
          <div class="pulse">${ic("swap")}</div>
          <div class="slot yours"><div class="who">Your ${kind} card</div>${card(S.front)}</div>
        </div>
        <div class="row" style="margin-top:12px">
          <div style="width:72px;height:72px;flex:none">${qrSvg(7)}</div>
          <button class="btn" data-act="do-swap" ${S.exPhase === "swapping" ? "disabled" : ""}>${ic("scan")}Scan Mariam's code</button>
        </div>
        <button class="link" style="display:block;margin:10px auto 0" data-act="scan-paper">No Wasl? Scan their paper card</button>`;
    },

    save() {
      const confirmed = S.ctxConfirmed;
      return `${back("exchange", "Back")}
        <h2 class="title" style="font-size:26px">Wasl knows where you met</h2>
        <p class="sub">${confirmed ? "Saved. Add a tag so you remember why." : "From your calendar and location. Just confirm it."}</p>
        <div style="margin:16px 0">${personCard(MARIAM)}</div>
        <div class="panel ctx">
          <div class="item">${ic("calendar")}<div><b>Campus networking night</b><span class="src">From your calendar</span></div></div>
          <div class="item">${ic("pin")}<div><b>Education City, Doha</b><span class="src">From your location</span></div></div>
          <div class="item">${ic("clock")}<div><b>Tonight, 7:40 PM</b><span class="src">When you swapped cards</span></div></div>
          ${confirmed ? `<div class="confirmed" style="margin-top:6px">${ic("check")}Saved to Mariam's story</div>` : `<div class="row" style="margin-top:8px"><button class="btn small" data-act="confirm-ctx">${ic("check")}That's right</button><button class="btn small secondary" data-act="change-ctx">Change</button></div>`}
        </div>
        ${confirmed ? `<div class="stack" style="margin-top:16px">
          <div class="label">Add a tag · one tap</div>
          <div class="chips">${TAGS.map((t) => `<button class="chip" data-act="tag" data-t="${t}" aria-pressed="${S.tags.includes(t)}">${S.tags.includes(t) ? ic("check") : ic("tag")}${t}</button>`).join("")}</div>
          <button class="btn" style="margin-top:8px" data-go="remember">${ic("mic")}Add a memory</button>
        </div>` : ""}`;
    },

    remember() {
      const recording = S.rec === "recording";
      const summarizing = S.rec === "summarizing";
      return `${back("network", "Network")}
        <div style="margin:8px 0 12px">${personCard(MARIAM)}</div>
        <div class="chips" style="margin-bottom:14px">
          <span class="chip">${ic("calendar")}${S.ctxConfirmed ? "Campus networking night" : "Where did you meet?"}</span>
          ${S.tags.map((t) => `<span class="chip" aria-pressed="true">${ic("tag")}${t}</span>`).join("")}
        </div>
        <div class="label">Memory</div>
        ${S.summary ? `<div class="panel summary" style="margin-top:8px">
            <div class="row" style="justify-content:space-between"><b>What mattered</b><span class="label" style="color:var(--orange)">AI summary</span></div>
            <ul>
              <li>Software engineer at Pearl Labs, works on their payments app</li>
              <li>Offered an intro to her CTO</li>
              <li>Pearl Labs is hiring interns for summer 2027</li>
            </ul>
            <div class="kept">${ic("trash")}Audio deleted. Only this summary is kept.</div>
          </div>
          <button class="btn secondary" style="margin-top:14px" data-go="debrief">See everyone from tonight</button>`
        : `<div class="panel" style="margin-top:8px">
            <div class="mic-wrap">
              ${summarizing ? `<b>Writing the summary…</b><div class="shimmer" style="width:80%"></div><div class="shimmer" style="width:60%"></div>`
                : `<button class="mic ${recording ? "rec" : ""}" id="mic" aria-label="${recording ? "Recording. Release to stop" : "Hold to record"}">${ic("mic")}</button>
                   ${recording ? `<div class="wave">${Array.from({ length: 14 }, (_, i) => `<i style="animation-delay:${(i * 73) % 500}ms"></i>`).join("")}</div><b id="recTime">0:00</b><span class="hint">Release to stop</span>`
                   : `<b>Hold to record the chat</b><span class="hint">Both people agree first. The audio isn't kept.</span>`}`}
            </div>
          </div>
          ${!recording && !summarizing ? '<button class="link" style="display:block;margin:10px auto 0" data-act="type-note">Type a note instead</button>' : ""}`}`;
    },

    debrief() {
      const left = TONIGHT.slice(S.debriefIdx);
      const favs = Object.values(S.debrief).filter((v) => v === "fav").length;
      const keeps = Object.values(S.debrief).filter((v) => v === "keep").length;
      if (!left.length)
        return `${back("network", "Network")}
          <h2 class="title" style="font-size:26px">Your whole night is saved</h2>
          <p class="sub">Campus networking night · 5 people</p>
          <div class="panel stack" style="margin:18px 0">
            <div class="row" style="justify-content:space-between"><span>Favorites</span><b>${favs}</b></div>
            <div class="row" style="justify-content:space-between"><span>Kept as contacts</span><b>${keeps}</b></div>
            <div class="row" style="justify-content:space-between"><span>New album</span><b>Campus networking night</b></div>
          </div>
          <button class="btn" data-go="network">${ic("network")}Open my network</button>`;
      return `${back("network", "Network")}
        <h2 class="title" style="font-size:26px">Tonight's people</h2>
        <p class="sub">Campus networking night · ${S.debriefIdx + 1} of ${TONIGHT.length}</p>
        <div class="deck" id="deck">
          ${left.slice(0, 3).reverse().map((p, i, arr) => {
            const top = i === arr.length - 1;
            const depth = arr.length - 1 - i;
            return personCard(p, { cls: top ? "top" : "", stamps: top, note: p.id === "mariam" && S.summary ? "Offered an intro to her CTO" : p.note, attrs: `data-pid="${p.id}" style="transform:translateY(${depth * 12}px) scale(${1 - depth * 0.04});z-index:${10 - depth}"` });
          }).join("")}
        </div>
        <div class="deck-actions">
          <button class="keep" data-act="deck" data-v="keep" aria-label="Keep as contact">${ic("x")}</button>
          <button class="mem" data-act="deck-memory" aria-label="Add a memory">${ic("mic")}</button>
          <button class="fav" data-act="deck" data-v="fav" aria-label="Favorite">${ic("star")}</button>
        </div>
        <p class="hint" style="margin-top:12px">Swipe right to favorite · left to keep as a contact</p>`;
    },

    network() {
      const all = peopleList();
      const sorts = [["recent", "Recent"], ["event", "Event"], ["company", "Company"], ["tag", "Tag"]];
      const groupKey = { event: "event", company: "org", tag: "tag" }[S.sort];
      let list = "";
      if (!groupKey) list = `<ul class="people">${all.map(personRow).join("")}</ul>`;
      else {
        const groups = {};
        all.forEach((p) => (groups[p[groupKey] || "No tag"] ||= []).push(p));
        list = Object.entries(groups).map(([g, ps]) => `<div class="label group-h">${esc(g)} · ${ps.length}</div><ul class="people">${ps.map(personRow).join("")}</ul>`).join("");
      }
      return `<div class="topline"><h2 class="title">Network</h2><button class="round quiet" data-go="debrief" aria-label="Tonight's people">${ic("star")}</button></div>
        <p class="sub">${all.length + 31} people · albums build themselves</p>
        <div class="label" style="margin-top:16px">Albums <span class="auto">· AUTO</span></div>
        <div class="albums" style="margin-top:8px">
          ${albums().map((a) => `<button class="album" data-act="album" data-a="${esc(a.name)}"><div class="cover">${a.colors.map((c) => `<i style="background:var(--card-${c})"></i>`).join("")}</div><b>${esc(a.name)}</b><span>${a.count} people</span></button>`).join("")}
          <button class="album new" data-act="new-album"><div class="cover">${ic("plus")}</div><b>New album</b><span>Make your own</span></button>
        </div>
        <div class="chips" style="margin-top:8px" role="group" aria-label="Sort">${sorts.map(([k, l]) => `<button class="chip" data-act="sort" data-s="${k}" aria-pressed="${S.sort === k}">${l}</button>`).join("")}</div>
        <div style="margin-top:6px">${list}</div>`;
    },

    album() {
      const a = albums().find((x) => x.name === S.album) || albums()[0];
      const ps = peopleList().filter(a.match);
      return `${back("network", "Network")}
        <h2 class="title" style="font-size:26px">${esc(a.name)}</h2>
        <p class="sub">${ps.length} cards · swipe to flip through</p>
        <div class="flip" style="margin-top:14px">${ps.map((p) => personCard(p, { foot: p.when ? "Met " + p.when : "" })).join("")}</div>
        <ul class="people">${ps.map(personRow).join("")}</ul>`;
    },

    recall() {
      const q = S.query;
      let results = "";
      if (S.recall === "searching") results = `<div class="panel stack" style="margin-top:16px"><span class="label" style="color:var(--violet)">Searching your memories…</span><div class="shimmer"></div><div class="shimmer" style="width:70%"></div></div>`;
      if (S.recall === "done") {
        const r = recallMatch(q);
        results = r.length
          ? r.map((m, i) => `<div style="margin-top:${i ? 18 : 16}px">
              <div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="label">${i ? "Also possible" : "Best match"}</span><span class="match">${m.score}% match</span></div>
              ${personCard(m.p)}
              <div class="panel why" style="margin-top:10px"><span class="label" style="color:var(--violet)">Why it matched</span><q>${esc(m.why)}</q><span class="src" style="color:var(--muted);font-size:12px;display:block;margin-top:6px">${esc(m.src)}</span></div>
            </div>`).join("")
          : `<div class="panel stack" style="margin-top:16px"><b>No one matched that</b><p class="sub">Try what they did, where you met, or what you talked about.</p></div>`;
      }
      return `<div class="topline"><h2 class="title">Recall</h2></div>
        <p class="sub">Ask like you remember it. No names needed.</p>

        ${results}`;
    },

    settings() {
      return `<div class="topline"><h2 class="title">Settings</h2></div>
        <div class="panel" style="margin-top:12px;padding-block:4px">

  function peopleList() {

  // ---------- render ----------

  // ---------- toast / confetti ----------

  let timers = [];
  const later = (ms, fn) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
  function resetAll() {
    timers.forEach(clearTimeout); timers = [];

  function typeQuery(text) {
    S.recall = "idle";
    S.query = "";
    render();
    const input = document.getElementById("recallInput");
    let i = 0;
    const step = () => {
      if (S.screen !== "recall") return;
      i += 2;
      input.value = text.slice(0, i);
      if (i < text.length) later(28, step);
      else submitRecall(text);
    };
    step();
  }
  function submitRecall(q) {
    q = q.trim();
    if (!q) return;
    S.query = q;
    S.recall = "searching";
    render();
    later(1100, () => { S.recall = "done"; render(); });
  }

  // recording: hold the mic, or tap for a short auto recording
  function startRec() {
    S.rec = "recording";

    recTimer = setInterval(() => {
      const el = document.getElementById("recTime");
      const s = Math.floor((Date.now() - recStart) / 1000);
      if (el) el.textContent = `0:${String(s).padStart(2, "0")}`;

  // debrief deck
  function decide(v) {

    S.debrief[p.id] = v;
    const finish = () => { S.debriefIdx++; render(); if (v === "fav") xpToast(`${p.name.split(" ")[0]} favorited`, 5); };
    if (top) {
      top.style.transition = "transform 260ms ease-in, opacity 260ms";
      top.style.transform = `translateX(${v === "fav" ? 420 : -420}px) rotate(${v === "fav" ? 18 : -18}deg)`;

  }
  function bindDeck() {
    const top = document.querySelector("#deck .card.top");
    if (!top) return;
    let sx = 0, dx = 0, dragging = false;
    const fav = top.querySelector(".stamp.fav");
    const keep = top.querySelector(".stamp.keep");
    top.addEventListener("pointerdown", (e) => { dragging = true; sx = e.clientX; dx = 0; top.setPointerCapture(e.pointerId); top.style.transition = "none"; });
    top.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      dx = e.clientX - sx;
      top.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
      fav.style.opacity = Math.max(0, Math.min(1, dx / 90));
      keep.style.opacity = Math.max(0, Math.min(1, -dx / 90));
    });
    const end = () => {
      if (!dragging) return;
      dragging = false;
      if (dx > 90) decide("fav");
      else if (dx < -90) decide("keep");
      else { top.style.transition = "transform 200ms"; top.style.transform = ""; fav.style.opacity = 0; keep.style.opacity = 0; }

  // ---------- walkthrough + user test guide ----------
  const STEPS = [

  const STEP_OF = { join: 0, profile: 0, build: 1, wallet: 2, exchange: 2, save: 3, remember: 4, debrief: 5, network: 6, album: 6, recall: 7, settings: -1 };

  function setupTo(i) {
    // start clean, then make every earlier step "done" so any step opens the same way each time

  const TASKS = [
    { text: "Set up your profile using your business card.", done: () => S.profileFilled },

  const T = { mode: "walk", idx: 0, running: false, start: 0, taps: 0, results: [], tick: null };

  function renderGuide() {
    const head = `<div class="guide-head">${symbol("mark")}<div style="flex:1"><h1>Wasl mockup</h1><p>Clickable prototype · Nov 2 check-in</p></div><button class="ghost guide-close" data-g="close">Close</button></div>

    if (T.mode === "walk") {
      const cur = STEP_OF[S.screen];
      body = `<ol class="steps">${STEPS.map((s, i) => `<li><button data-g="step" data-i="${i}" ${cur === i ? 'aria-current="step"' : ""} class="${cur > i ? "done" : ""}"><span class="num">${s.n}</span><span><span class="t">${s.t}</span><span class="h">${s.h}</span></span><span class="wow w${s.wow}">${WOW[s.wow]}</span></button></li>`).join("")}</ol>
        <p class="guide-note"><b>WOW 1</b> Share the right you · <b>WOW 2</b> Every connection keeps its story · <b>WOW 3</b> Find people by memory</p>
        <div class="guide-actions"><button class="ghost" data-g="restart">Restart</button></div>`;
    } else {
      const done = T.results.length >= TASKS.length;
      const t = TASKS[T.idx];
      const secs = T.running ? Math.floor((Date.now() - T.start) / 1000) : 0;
      body = done ? "" : `<div class="task-card">
          <span class="eyebrow">Task ${T.idx + 1} of ${TASKS.length}</span>

            : `<p class="guide-note">Read the task out loud, then press Start. Don't help unless they're stuck.</p><div class="guide-actions"><button class="btn small" data-g="start">Start task</button></div>`}
        </div>`;
      body += T.results.length ? `<div><table class="results"><thead><tr><th>#</th><th>Result</th><th>Time</th><th>Taps</th></tr></thead><tbody>${T.results.map((r, i) => `<tr><td>${i + 1}</td><td class="${r.ok ? "ok" : "no"}">${r.ok ? "Done" : "Skipped"}</td><td>${r.secs}s</td><td>${r.taps}</td></tr>`).join("")}</tbody></table></div>
        <div class="guide-actions"><button class="ghost" data-g="copy">${ic("copy", 'style="width:14px;height:14px;vertical-align:-2px"')} Copy results</button><button class="ghost" data-g="newtest">New tester</button></div>` : "";
      if (done) body = `<div class="task-card"><span class="eyebrow">All tasks done</span><span class="task">Copy the results into your testing notes, then start the next tester.</span></div>` + body;
    }
    guide.innerHTML = head + body;
    // mobile bar
    if (T.mode === "test" && T.running) mobileBar.innerHTML = `<b>Task ${T.idx + 1}</b> ${esc(TASKS[T.idx].text)}`;
    else if (T.mode === "test") mobileBar.innerHTML = `<b>User test</b> Open the guide to start`;
    else { const cur = STEP_OF[S.screen]; mobileBar.innerHTML = cur >= 0 ? `<b>Step ${STEPS[cur].n}</b> ${STEPS[cur].t} · ${WOW[STEPS[cur].wow]}` : "<b>Guide</b>"; }
  }
  function checkTask() {
    if (T.mode !== "test" || !T.running) return;
    if (TASKS[T.idx].done()) finishTask(true);
  }
  function finishTask(ok) {
    T.results.push({ ok, secs: Math.round((Date.now() - T.start) / 1000), taps: T.taps });
    T.running = false;
    clearInterval(T.tick);
    T.idx = Math.min(T.idx + 1, TASKS.length - 1);
    if (ok) toast(`Task complete <span class="xp">${T.results[T.results.length - 1].secs}s</span>`);
    renderGuide();
  }
  function prepTask(i) {
    // each task starts from a state where the earlier tasks are done
    if (i === 0) { resetAll(); return; }
    if (i >= 1) { S.profileFilled = true; S.joinPhase = "choose"; S.screen = "profile"; }
    if (i >= 3) { S.swappedWith = S.swappedWith || S.front; S.exPhase = "done"; S.screen = "exchange"; }
    if (i >= 4) { S.ctxConfirmed = true; S.mariamSaved = true; if (!S.tags.includes("Hiring")) S.tags.push("Hiring"); S.screen = "network"; }
    if (i >= 5) { S.summary = true; S.consent = true; S.recall = "idle"; S.query = ""; S.screen = "network"; }
  }
  document.getElementById("device").addEventListener("pointerdown", () => {
    if (T.mode === "test" && T.running) { T.taps++; const el = document.getElementById("tTaps"); if (el) el.textContent = `${T.taps} taps`; }
  }, true);
  mobileBar.addEventListener("click", () => { guide.classList.add("open"); });
  guide.addEventListener("click", (e) => {
    const b = e.target.closest("[data-g]");
    if (!b) return;
    const g = b.dataset.g;
    if (g === "close") { guide.classList.remove("open"); return; }
    if (g === "walk" || g === "test") { T.mode = g; if (g === "test" && !T.results.length && !T.running) { resetAll(); T.idx = 0; } render(); return; }
    if (g === "step") { setupTo(+b.dataset.i); S.sheet = null; guide.classList.remove("open"); render(); return; }
    if (g === "restart") { resetAll(); render(); return; }
    if (g === "start") {
      prepTask(T.idx);
      T.running = true; T.start = Date.now(); T.taps = 0;
      T.tick = setInterval(() => { const el = document.getElementById("tSecs"); if (el) el.textContent = Math.floor((Date.now() - T.start) / 1000) + "s"; }, 500);
      guide.classList.remove("open");
      render();
      return;
    }
    if (g === "giveup") { finishTask(false); return; }
    if (g === "newtest") { T.results = []; T.idx = 0; T.running = false; resetAll(); render(); return; }
    if (g === "copy") {
      const txt = ["Task\tResult\tSeconds\tTaps", ...T.results.map((r, i) => `${i + 1}. ${TASKS[i].text}\t${r.ok ? "Done" : "Skipped"}\t${r.secs}\t${r.taps}`)].join("\n");
      const ok = () => toast("Results copied");
      try { navigator.clipboard.writeText(txt).then(ok, () => fallbackCopy(txt)); } catch (err) { fallbackCopy(txt); }
    }
  });
  function fallbackCopy(txt) {
    const ta = document.createElement("textarea");
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("Results copied"); } catch (e) { toast("Select the table and copy it"); }
    ta.remove();
  }

  // open a step directly with #step-1 … #step-7 (handy for slides and screenshots)
  function openHash() {
    const m = /^#step-(\d|bonus)$/.exec(location.hash || "");
    if (!m) return false;
    const i = m[1] === "bonus" ? 5 : +m[1] >= 6 ? +m[1] : +m[1] - 1;
    setupTo(Math.min(Math.max(i, 0), STEPS.length - 1));
    return true;
  }
  window.addEventListener("hashchange", () => { if (openHash()) render(); });
  openHash();
  render();
})();
</script>
</body>
</html>
